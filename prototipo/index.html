<title>Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de app (≤440px) con barra de pestañas fija y botón "+" central; el onboarding ocupa la columna completa, una pregunta por pantalla. */
:root {
  --plane: #e9eeec;
  --bg: #f5f8f7;
  --surface: #ffffff;
  --surface-2: #edf1ef;
  --line: #dce3e0;
  --ink: #0f1916;
  --ink-2: #4c5854;
  --muted: #74807b;
  --accent: #26357f;
  --accent-ink: #ffffff;
  --accent-soft: #e5e8f6;
  --good: #0b7a3b;
  --bad: #b8342d;
  --warn-ink: #8a5700;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s-rest: #c3c2b7;
  --grid: #e3e8e6;
  --st-good: #0ca30c; --st-warn: #fab219; --st-serious: #ec835a; --st-critical: #d03b3b;
  --shadow: 0 1px 2px rgba(15,25,22,.04), 0 8px 28px rgba(15,25,22,.08);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plane: #060908; --bg: #0c1110; --surface: #141a18; --surface-2: #1c2421; --line: #27302d;
    --ink: #eef3f1; --ink-2: #b4beba; --muted: #86918d;
    --accent: #a3b0ff; --accent-ink: #0c1110; --accent-soft: #222a4f;
    --good: #45c774; --bad: #ff7b71; --warn-ink: #f0b54a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s-rest: #4a4a46;
    --grid: #252d2a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plane: #060908; --bg: #0c1110; --surface: #141a18; --surface-2: #1c2421; --line: #27302d;
  --ink: #eef3f1; --ink-2: #b4beba; --muted: #86918d;
  --accent: #a3b0ff; --accent-ink: #0c1110; --accent-soft: #222a4f;
  --good: #45c774; --bad: #ff7b71; --warn-ink: #f0b54a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s-rest: #4a4a46;
  --grid: #252d2a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--plane); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.i { flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }
.neg { color: var(--bad) !important; }

.app { max-width: 440px; margin: 0 auto; min-height: 100%; background: var(--bg); display: flex; flex-direction: column; position: relative; }
@media (min-width: 720px) {
  body { padding-block: 20px; }
  .app { min-height: calc(100% - 40px); border-radius: 30px; border: 1px solid var(--line); box-shadow: var(--shadow); overflow: clip; }
}

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
.topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0; flex: 1; min-width: 0; }
.topbar .sub { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); flex: none; }
.icon-btn:hover { color: var(--ink); }
.icon-btn:disabled { opacity: .3; cursor: default; }

main { flex: 1; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.storage-note { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 8px 12px; }

.tabbar { position: sticky; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--muted); padding: 6px 0 2px; border-radius: 12px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab-plus { display: grid; place-items: center; }
.tab-plus span { width: 56px; height: 56px; margin-top: -26px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 18px color-mix(in oklab, var(--accent) 40%, transparent); transition: transform .15s ease; }
.tab-plus:hover span { transform: translateY(-2px); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sec-head h2 { font-size: 15.5px; font-weight: 600; margin: 0; text-wrap: balance; }
.link { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

.hero { padding: 6px 2px 2px; }
.hero .label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.hero .big { font-size: clamp(34px, 10vw, 46px); font-weight: 600; letter-spacing: -.025em; line-height: 1.1; margin: 4px 0 8px; overflow-wrap: anywhere; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.hero .meta b { font-weight: 600; color: var(--ink); }

.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
button.kpi:hover { border-color: color-mix(in oklab, var(--accent) 35%, var(--line)); }
.kpi .k-label { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.kpi .k-val { font-size: 18px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.kpi .k-sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.up-good, .down-good { color: var(--good); }
.up-bad, .down-bad { color: var(--bad); }

.dist { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
@media (max-width: 370px) { .dist { grid-template-columns: 1fr; justify-items: center; } }
.donut { width: 132px; height: 132px; display: block; }
.donut .d-top { font-size: 11px; fill: var(--muted); font-family: var(--font); }
.donut .d-big { font-size: 15px; font-weight: 600; fill: var(--ink); font-family: var(--font); }
.legend { display: flex; flex-direction: column; gap: 8px; width: 100%; min-width: 0; }
.lg { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 8px; align-items: center; font-size: 13px; line-height: 1.25; }
.lg .sw { width: 10px; height: 10px; border-radius: 3px; }
.lg .v { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.lg .p { display: inline-block; min-width: 34px; color: var(--muted); font-weight: 500; margin-left: 6px; font-size: 12px; }
.warnline { margin-top: 12px; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }

.hbars { display: flex; flex-direction: column; gap: 12px; }
.hbar .top { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 5px; }
.hbar .top .name { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.hbar .top .val { font-weight: 600; font-variant-numeric: tabular-nums; }
.hbar .track { height: 8px; }
.hbar .track i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.delta { font-size: 11.5px; font-weight: 600; padding: 1px 6px; border-radius: 99px; background: var(--surface-2); font-variant-numeric: tabular-nums; }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 18px 8px 10px; color: var(--muted); }
.empty .e-ic { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); margin-bottom: 4px; }
.empty b { color: var(--ink); font-weight: 600; font-size: 14.5px; }
.empty p { margin: 0; font-size: 13px; max-width: 30ch; }
.empty .btn { margin-top: 8px; }

.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; text-align: left; width: 100%; }
.row + .row { border-top: 1px solid var(--line); }
button.row:hover .r-title { color: var(--accent); }
.bubble { width: 40px; height: 40px; border-radius: 13px; background: var(--surface-2); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.r-main { flex: 1; min-width: 0; }
.r-title { display: block; font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-sub { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.r-amt small { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.amt-in { color: var(--good); }
.amt-tr { color: var(--ink-2); }
.day-head { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 14px 2px 4px; }
.day-head:first-of-type { padding-top: 0; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { padding: 8px 6px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.monthbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthbar strong { font-size: 15px; font-weight: 600; text-transform: capitalize; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; color: var(--muted); }
.search input { border: 0; outline: 0; background: none; padding: 10px 0; width: 100%; color: var(--ink); }

.menu { display: flex; flex-direction: column; }
.menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; text-align: left; width: 100%; }
.menu-item + .menu-item { border-top: 1px solid var(--line); }
.menu-item .r-main b { display: block; font-weight: 600; font-size: 14.5px; }
.pill { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; font-size: 14px; }
.kv + .kv { border-top: 1px solid var(--line); }
.kv > span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.kv.total { border-top: 1.5px solid var(--ink) !important; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
.input[aria-invalid="true"] { border-color: var(--bad); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; padding: 12px 16px; font-weight: 600; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: color-mix(in oklab, var(--st-critical) 14%, var(--surface)); color: var(--bad); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 11px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.block { width: 100%; }
.switch { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
textarea.csv { width: 100%; min-height: 140px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface-2); color: var(--ink); resize: vertical; }
.msg { font-size: 12.5px; min-height: 1em; margin: 0; }
.msg.err { color: var(--bad); }
.msg.warn { color: var(--warn-ink); }
.danger-zone { border-color: color-mix(in oklab, var(--st-critical) 40%, var(--line)); }

.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font); font-size: 10px; fill: var(--muted); }
.chart .end { fill: var(--ink); font-weight: 600; font-size: 10.5px; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: color-mix(in oklab, var(--ink) 5%, transparent); }
.series-legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.series-legend span { display: inline-flex; align-items: center; gap: 6px; }
.series-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Onboarding */
.ob { flex: 1; display: flex; flex-direction: column; min-height: 100%; }
.ob-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg); padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
.ob-top { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.ob-brand { color: var(--ink); font-weight: 700; font-size: 15px; }
.progress { height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .25s ease; }
.ob-body { flex: 1; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.ob-body h2 { font-size: 24px; line-height: 1.2; letter-spacing: -.015em; margin: 8px 0 0; text-wrap: balance; }
.ob-body .help { margin: 0; color: var(--ink-2); }
.money { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 6px 14px; }
.money:focus-within { border-color: var(--accent); }
.money[data-invalid="true"] { border-color: var(--bad); }
.money .cur { font-weight: 700; color: var(--accent); font-size: 15px; }
.money input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 28px; font-weight: 600; padding: 8px 0; font-variant-numeric: tabular-nums; }
.money input::placeholder { color: var(--line); }
.choices { display: grid; gap: 10px; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice b { font-weight: 600; }
.cur-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cur-opt { text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.cur-opt b { font-size: 15px; }
.cur-opt span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cur-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.debt-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.ob-foot { position: sticky; bottom: 0; background: var(--bg); padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; border-top: 1px solid var(--line); }
.ob-foot .btn.primary { flex: 1; }
.sum-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; }
.sum-row + .sum-row { border-top: 1px solid var(--line); }
.sum-row .r-main b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
.loading { flex: 1; display: grid; place-items: center; color: var(--muted); gap: 12px; padding: 40px; text-align: center; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--surface-2); border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 0 auto 10px; }

/* Hoja inferior */
.backdrop { position: fixed; inset: 0; background: rgba(6,10,9,.42); z-index: 20; animation: fade .2s ease; }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(440px, 100%); max-height: 94%; overflow-y: auto; z-index: 21; background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .24s cubic-bezier(.2,.8,.2,1); }
.grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 2px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -8px; z-index: 2; background: var(--surface); padding: 8px 0 6px; margin-top: -8px; }
.sheet-head h3 { margin: 0; font-size: 17px; font-weight: 700; }
.save-bar { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding: 8px 0 16px; margin-bottom: -16px; z-index: 2; display: flex; flex-direction: column; gap: 6px; }
.nlp { display: flex; gap: 8px; align-items: center; background: var(--accent-soft); border-radius: 14px; padding: 4px 4px 4px 12px; }
.nlp input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 8px 0; }
.nlp input::placeholder { color: color-mix(in oklab, var(--accent) 60%, var(--muted)); }
.nlp button { background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 8px 10px; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; }
.parsed { font-size: 12.5px; color: var(--accent); margin-top: -6px; display: flex; gap: 6px; align-items: center; }
.amount-display { display: flex; align-items: baseline; justify-content: center; gap: 8px; padding: 4px 0; }
.amount-display .cur { font-size: 14px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 3px 8px; }
.amount-display .val { font-size: 38px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.amount-display .val.empty { color: var(--muted); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { height: 46px; border-radius: 14px; background: var(--surface-2); font-size: 21px; font-weight: 500; display: grid; place-items: center; }
.keypad button:active { background: var(--line); }
.catgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.catbtn { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 2px; border-radius: 14px; font-size: 11.5px; font-weight: 500; color: var(--ink-2); border: 1px solid transparent; background: var(--surface-2); min-width: 0; }
.catbtn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: 2px; }
.catbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.lbl { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.row2 { display: flex; gap: 8px; align-items: center; }

/* Montos: acepta 1.234,56 · 1234.56 · 1234,56 · 1,234.56. Devuelve centavos (enteros, nunca float). */
function parseAmount(raw) {
  let s = String(raw ?? '').trim().replace(/[\s ]/g, '');

  if (s.startsWith('-') || s.startsWith('−')) return { error: 'No se permiten montos negativos.' };
  if (!/^[\d.,]+$/.test(s)) return { error: 'Ingresá solo números.' };

  if (dec.length > 2) return { error: 'Máximo 2 decimales.' };
  const groups = intPart.split(/[.,]/);
  if (groups.length > 1 && (!groups[0] || groups[0].length > 3 || groups.slice(1).some(g => g.length !== 3))) return { error: 'Revisá los separadores de miles.' };

  const digits = groups.join('') || '0';
  const cents = Number(digits) * 100 + Number((dec + '00').slice(0, 2));
  if (!Number.isSafeInteger(cents) || cents > 1e15) return { error: 'El monto es demasiado grande.' };
  return { cents };
}

  const v = Number(s);

}

function totals(upto = '9999-12-31') {
  const p = S.profile;
  let disp = p.disponible_inicial, ahorro = p.ahorros_inicial, inv = p.inversiones_inicial;
  const debt = {};
  for (const d of S.debts) if ((d.fecha || p.fecha_inicio) <= upto) debt[d.id] = d.importe_pendiente;
  for (const m of S.movements) {
    if (m.fecha > upto) continue;
    switch (m.tipo) {
      case 'ingreso': disp += m.importe; break;
      case 'gasto': if (m.deuda_id && m.deuda_id in debt) debt[m.deuda_id] += m.importe; else disp -= m.importe; break;
      case 'ahorro': disp -= m.importe; ahorro += m.importe; break;
      case 'inversion': disp -= m.importe; inv += m.importe; break;
      case 'pago_deuda': disp -= m.importe; if (m.deuda_id in debt) debt[m.deuda_id] -= m.importe; break;
      case 'valuacion': inv += m.importe; break;
    }
  }
  const deuda = Object.values(debt).reduce((a, b) => a + b, 0);
  const activos = disp + ahorro + inv;
  return { disp, ahorro, inv, debt, deuda, activos, neto: activos - deuda, liquidez: disp + ahorro, ratio: activos > 0 ? deuda / activos : null };
}

function monthStats(ym) {
  const s = { income: 0, expense: 0, cashExpense: 0, ahorro: 0, inversion: 0, pagos: 0, byCat: {}, count: 0 };
  for (const m of S.movements) {
    if (m.fecha.slice(0, 7) !== ym || m.tipo === 'valuacion') continue;
    s.count++;
    if (m.tipo === 'ingreso') s.income += m.importe;
    else if (m.tipo === 'gasto') { s.expense += m.importe; if (!m.deuda_id) s.cashExpense += m.importe; const k = m.categoria || 'otros'; s.byCat[k] = (s.byCat[k] || 0) + m.importe; }
    else if (m.tipo === 'ahorro') s.ahorro += m.importe;
    else if (m.tipo === 'inversion') s.inversion += m.importe;
    else if (m.tipo === 'pago_deuda') s.pagos += m.importe;
  }
  s.unassigned = s.income - s.cashExpense - s.ahorro - s.inversion - s.pagos;
  s.saveRate = s.income > 0 ? (s.income - s.expense) / s.income : null;
  s.days = ym === curMonth() ? +today().slice(8) : daysIn(ym);
  return s;
}

        ${o.debts.length ? `<div style="display:flex;flex-direction:column;gap:8px">${o.debts.map(d => `<div class="debt-item"><span class="bubble" style="width:34px;height:34px">${ic('card', 17)}</span><span class="r-main"><span class="r-title">${esc(d.nombre)}</span><span class="r-sub">${[d.cuota_mensual ? `Cuota ${fmt(d.cuota_mensual, { force: true, cur: o.moneda })}` : '', d.interes_anual ? `${String(d.interes_anual).replace('.', DEC_SEP)}% anual` : ''].filter(Boolean).join(' · ') || 'Sin cuota ni tasa'}</span></span><span class="r-amt">${fmt(d.importe_pendiente, { force: true, cur: o.moneda })}</span><button type="button" class="icon-btn" style="width:32px;height:32px" data-act="obDelDebt" data-arg="${d.id}" aria-label="Quitar ${esc(d.nombre)}">${ic('x', 16)}</button></div>`).join('')}
          <p class="small muted" style="margin:0;text-align:right">Total: <b style="color:var(--ink)">${fmt(obDebtsTotal(), { force: true, cur: o.moneda })}</b></p></div>` : ''}
        <div class="card" style="display:flex;flex-direction:column;gap:10px">
          <b style="font-size:14px">${o.debts.length ? 'Agregar otra deuda' : 'Agregar una deuda'}</b>
          <div class="field"><label for="d-nombre">Nombre</label><input class="input" id="d-nombre" placeholder="Tarjeta Visa, préstamo auto…" value="${esc(f.nombre)}" data-input="obForm" data-key="nombre" aria-invalid="${!!fe.nombre}"><p class="msg err" data-err="nombre">${esc(fe.nombre || '')}</p></div>
          <div class="field"><label for="d-importe">Importe pendiente</label><input class="input num" id="d-importe" inputmode="decimal" placeholder="0${DEC_SEP}00" value="${esc(f.importe)}" data-input="obForm" data-key="importe" aria-invalid="${!!fe.importe}"><p class="msg err" data-err="importe">${esc(fe.importe || '')}</p></div>
          <div class="grid2">
            <div class="field"><label for="d-cuota">Cuota mensual <span class="muted">(opcional)</span></label><input class="input num" id="d-cuota" inputmode="decimal" placeholder="0${DEC_SEP}00" value="${esc(f.cuota)}" data-input="obForm" data-key="cuota" aria-invalid="${!!fe.cuota}"><p class="msg err" data-err="cuota">${esc(fe.cuota || '')}</p></div>
            <div class="field"><label for="d-interes">Interés anual % <span class="muted">(opcional)</span></label><input class="input num" id="d-interes" inputmode="decimal" placeholder="0" value="${esc(f.interes)}" data-input="obForm" data-key="interes" aria-invalid="${!!fe.interes}"><p class="msg err" data-err="interes">${esc(fe.interes || '')}</p></div>

        </div>` : ''}
      ${o.err ? `<p class="msg err" role="alert">${esc(o.err)}</p>` : ''}`;
  } else if (st === 5) {
    const v = obValues();
    const row = (label, value, step, sub) => `<div class="sum-row"><span class="r-main"><span class="r-sub">${label}</span><b>${value}</b>${sub ? `<span class="r-sub">${sub}</span>` : ''}</span><button type="button" class="btn sm ghost" data-act="obEdit" data-arg="${step}">${ic('pencil', 14)}Editar</button></div>`;

      <div class="card" style="padding-block:4px">
        ${row('Moneda principal', `${o.moneda} · ${esc(CURRENCIES.find(c => c[0] === o.moneda)?.[1] || '')}`, 0)}

        ${row('Inversiones', fmt(v.inv, { force: true }), 3)}

      <div class="card">
        <div class="sec-head" style="margin-bottom:4px"><h2>Calculado a partir de tus datos</h2></div>

        <div class="kv"><span>Deuda total</span><span>${fmt(v.deuda, { force: true })}</span></div>
        <div class="kv"><span>Liquidez</span><span>${fmt(v.liquidez, { force: true })}</span></div>
        <div class="kv"><span>Ratio de endeudamiento</span><span>${pct(v.ratio)}</span></div>
        <div class="kv total"><span>Patrimonio neto</span><span class="${v.neto < 0 ? 'neg' : ''}">${fmt(v.neto, { force: true })}</span></div>
      </div>`;
    nextLabel = 'Confirmar y empezar';
  }
  if (o.back && st !== 5) nextLabel = 'Volver al resumen';
  return `<form class="ob" data-form="ob" novalidate>
    <div class="ob-head"><div class="ob-top"><span class="ob-brand">${esc(APP.name)}</span><span>Paso ${st + 1} de ${OB_STEPS}</span></div>
      <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${OB_STEPS}" aria-valuenow="${st + 1}" aria-label="Progreso"><i style="width:${(st + 1) / OB_STEPS * 100}%"></i></div></div>
    <div class="ob-body">${body}</div>
    <div class="ob-foot">${st > 0 ? `<button type="button" class="btn ghost" data-act="obBack">${ic('back', 18)}Atrás</button>` : ''}<button type="submit" class="btn primary" id="ob-next" ${nextDisabled ? 'disabled' : ''}>${nextLabel}</button></div>
  </form>`;
}
function validateDebtForm(f) {
  const e = {}, imp = parseAmount(f.importe), cu = parseAmount(f.cuota), it = parseRate(f.interes);
  if (!f.nombre.trim()) e.nombre = 'Poné un nombre para reconocerla.';
  if (imp.error) e.importe = imp.error; else if (!imp.cents) e.importe = 'Ingresá el importe pendiente.';
  if (cu.error) e.cuota = cu.error;
  if (it.error) e.interes = it.error;
  return { e, debt: Object.keys(e).length ? null : { id: uid(), nombre: f.nombre.trim().slice(0, 60), importe_pendiente: imp.cents, cuota_mensual: cu.cents || null, interes_anual: it.value } };
}
const formDirty = f => f.nombre.trim() || f.importe.trim() || f.cuota.trim() || f.interes.trim();
function obNext() {
  const o = S.ob;
  o.err = '';
  if (OB_AMOUNT[o.step] && parseAmount(o[OB_AMOUNT[o.step].key]).error) return;
  if (o.step === 4) {
    if (o.hasDebts === null) { o.err = 'Elegí una opción para seguir.'; return render(); }
    if (o.hasDebts) {
      if (formDirty(o.form)) { const { e, debt } = validateDebtForm(o.form); o.formErr = e; if (!debt) { o.err = 'Completá o vaciá el formulario de la deuda.'; return render(); } o.debts.push(debt); o.form = { nombre: '', importe: '', cuota: '', interes: '' }; }
      if (!o.debts.length) { o.err = 'Agregá al menos una deuda o elegí “No tengo deudas”.'; return render(); }
    }
  }
  if (o.step === 5) return obConfirm();
  o.step = o.back ? 5 : o.step + 1;
  o.back = false;
  render(); focusOb();
}
async function obConfirm() {
  const o = S.ob, v = obValues(), start = today();
  const debts = (o.hasDebts ? o.debts : []).map(d => ({ ...d, fecha: start }));
  const profile = { moneda: o.moneda, disponible_inicial: v.disp, ahorros_inicial: v.ahorro, inversiones_inicial: v.inv, fecha_inicio: start, onboarding_completado: true, montos_en: 'centavos', version: 1 };
  const btn = document.getElementById('ob-next'); if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  const prev = { profile: S.profile, debts: S.debts };
  S.debts = debts; S.profile = profile;
  try {
    for (const d of debts) await Store.putDebt(d);
    await Store.saveProfile();
    S.ob = null; S.route = 'inicio';
    render(); window.scrollTo(0, 0);
    toast('Listo: tu punto de partida quedó guardado.');
  } catch (e) { S.profile = prev.profile; S.debts = prev.debts; saveError(e); render(); }
}
function focusOb() { requestAnimationFrame(() => document.getElementById('ob-amount')?.focus({ preventScroll: true })); }

function txRow(m) {
  const c = cat(m.categoria), t = TIPOS[m.tipo];
  const debt = m.deuda_id ? S.debts.find(d => d.id === m.deuda_id) : null;
  let icon = c?.icon || t.icon, title = m.descripcion || c?.name || t.label, sub, amt, cls = '';
  if (m.tipo === 'gasto') { sub = `${c ? c.name : 'Sin categoría'}${debt ? ` · con ${debt.nombre}` : ''}`; amt = fmt(-m.importe, { sign: true }); }
  else if (m.tipo === 'ingreso') { sub = c ? c.name : 'Ingreso'; amt = fmt(m.importe, { sign: true }); cls = 'amt-in'; }
  else if (m.tipo === 'pago_deuda') { sub = `Pago · ${debt ? debt.nombre : 'deuda eliminada'}`; amt = fmt(m.importe); cls = 'amt-tr'; }
  else if (m.tipo === 'valuacion') { sub = m.importe >= 0 ? 'Ganancia de inversiones' : 'Pérdida de inversiones'; amt = fmt(m.importe, { sign: true }); cls = m.importe >= 0 ? 'amt-in' : ''; }
  else { sub = m.tipo === 'ahorro' ? 'Disponible → Ahorros' : 'Disponible → Inversiones'; amt = fmt(m.importe); cls = 'amt-tr'; }
  return `<button class="row" data-act="openTx" data-arg="${m.id}"><span class="bubble">${ic(icon, 19)}</span><span class="r-main"><span class="r-title">${esc(title)}</span><span class="r-sub">${esc(sub)}</span></span><span class="r-amt ${cls}">${amt}</span></button>`;
}
const sortMov = list => list.slice().sort((a, b) => (b.fecha + (b.hora || '')).localeCompare(a.fecha + (a.hora || '')) || (b.creado || '').localeCompare(a.creado || ''));

function monthBar(key, m, months) {
  return `<div class="monthbar"><button class="icon-btn" data-act="month" data-arg="${key}:-1" ${m <= months[0] ? 'disabled' : ''} aria-label="Mes anterior">${ic('prev', 18)}</button>

function distribution(st) {

  return `<div class="dist">${donut(segs, 'Ingresos', fmtC(st.income))}<div class="legend">${segs.map(s => `<div class="lg"><i class="sw" style="background:${s.color}"></i><span>${s.label}</span><span class="v">${fmtC(s.value)}<span class="p">${pct(s.value / st.income)}</span></span></div>`).join('')}</div></div>

function movList() {
  const q = S.movQuery.trim().toLowerCase(), f = S.movFilter;

  if (!list.length) return S.movements.length ? `<p class="muted" style="margin:6px 0;text-align:center">No hay movimientos con ese filtro en ${monthName(S.movMonth)}.</p>` : empty('inbox', 'Tus ingresos, gastos y transferencias van a aparecer acá.', addCta());

function newDraft(tipo = 'gasto', extra = {}) { return { tipo, int: '', dec: null, categoria: null, deuda_id: null, pagaCon: null, fecha: today(), descripcion: '', allCats: false, nlp: '', parsed: null, ...extra }; }
const draftCents = d => Number(d.int || '0') * 100 + Number(((d.dec || '') + '00').slice(0, 2));
function draftDisplay(d) { if (!d.int && d.dec == null) return '0'; const i = new Intl.NumberFormat(LOCALE).format(Number(d.int || '0')); return d.dec == null ? i : i + DEC_SEP + d.dec; }
function catUsage(kind) { const n = {}; for (const m of S.movements) if (m.tipo === kind && m.categoria) n[m.categoria] = (n[m.categoria] || 0) + 1; return CATEGORIES.filter(c => c.kind === kind).map((c, i) => ({ c, i })).sort((a, b) => (n[b.c.id] || 0) - (n[a.c.id] || 0) || a.i - b.i).map(x => x.c); }
function draftError(d) {
  const amt = draftCents(d);
  if (!amt) return '';
  if (d.tipo === 'pago_deuda') { if (!d.deuda_id) return 'Elegí qué deuda pagás.'; const pend = totals().debt[d.deuda_id] ?? 0; if (amt > pend) return `Supera lo pendiente (${fmt(pend, { force: true })}).`; }
  return '';
}
function sheetAdd() {

  const willNeg = amt && ((d.tipo !== 'ingreso' && !(d.tipo === 'gasto' && d.deuda_id)) && t.disp - amt < 0);

  <form class="nlp" data-form="nlp"><input id="nlp" placeholder="Probá: hoy gasté 15 mil en combustible" value="${esc(d.nlp)}" data-input="nlp" autocomplete="off"><button type="submit">${ic('mic', 15)}Interpretar</button></form>
  ${d.parsed ? `<p class="parsed">${ic('check', 14)}${esc(d.parsed)}</p>` : ''}
  <div class="chips" role="group" aria-label="Tipo de movimiento">${['gasto', 'ingreso', 'ahorro', 'inversion', 'pago_deuda'].map(k => `<button class="chip" data-act="dtype" data-arg="${k}" aria-pressed="${d.tipo === k}">${ic(TIPOS[k].icon, 15)}${TIPOS[k].label}</button>`).join('')}</div>

  <div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'dec', '0', 'del'].map(k => `<button type="button" data-act="key" data-arg="${k}" aria-label="${k === 'del' ? 'Borrar' : k === 'dec' ? 'Decimales' : k}">${k === 'del' ? ic('del', 22) : k === 'dec' ? DEC_SEP : k}</button>`).join('')}</div>

const KEYWORDS = {
  combustible: ['nafta', 'combustible', 'gasoil', 'ypf', 'shell', 'axion'], comida: ['comida', 'almuerzo', 'cena', 'mcdonald', 'burger', 'pizza', 'delivery', 'café', 'cafe', 'sushi', 'empanadas'],
  super: ['super', 'supermercado', 'chino', 'almacén', 'almacen', 'verdulería', 'verduleria', 'mayorista'], transporte: ['uber', 'taxi', 'sube', 'colectivo', 'subte', 'tren', 'cabify', 'didi'],
  salidas: ['bar', 'birra', 'cerveza', 'salida', 'boliche', 'fernet', 'tragos'], entretenimiento: ['cine', 'recital', 'juego', 'teatro', 'steam', 'entradas'],
  ropa: ['ropa', 'zapatillas', 'remera', 'jean', 'campera'], tecnologia: ['celular', 'auriculares', 'compu', 'notebook', 'cargador'],
  salud: ['farmacia', 'médico', 'medico', 'prepaga', 'remedio', 'dentista'], hogar: ['alquiler', 'expensas', 'luz', 'gas', 'agua', 'internet'],
  vehiculo: ['seguro', 'mecánico', 'mecanico', 'patente', 'lavadero'], viajes: ['vuelo', 'hotel', 'pasaje', 'viaje'],
  suscripciones: ['netflix', 'spotify', 'suscripción', 'suscripcion'], sueldo: ['sueldo', 'salario', 'aguinaldo'], freelance: ['freelance', 'proyecto', 'cliente', 'honorarios'],
  regalos: ['regalo', 'regalaron'], ventas: ['vendí', 'vendi', 'venta'],
};
function parseNatural(text) {
  const t = text.toLowerCase();
  const m = t.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(mil\b|k\b|lucas?\b|palos?\b|millones?\b|millón\b)?/);
  if (!m) return null;
  let cents = parseAmount(m[1]).cents || 0;
  if (m[2]) cents *= /^(mil|k|luca)/.test(m[2]) ? 1e3 : 1e6;
  const fecha = /anteayer/.test(t) ? addDays(today(), -2) : /ayer/.test(t) ? addDays(today(), -1) : today();
  let tipo = 'gasto';
  if (/(cobr[eé]|recib[ií]|ingres|me pagaron|me depositaron|vend[ií])/.test(t)) tipo = 'ingreso';
  else if (/ahorr/.test(t)) tipo = 'ahorro';
  else if (/invert[ií]|invers/.test(t)) tipo = 'inversion';
  else if (/pagu[eé].*(tarjeta|deuda|pr[eé]stamo|cuota)|pago de (la )?(tarjeta|deuda)/.test(t)) tipo = 'pago_deuda';
  let categoria = null, deuda_id = null;
  if (tipo === 'gasto' || tipo === 'ingreso') for (const [k, words] of Object.entries(KEYWORDS)) if (cat(k)?.kind === tipo && words.some(w => t.includes(w))) { categoria = k; break; }
  if (tipo === 'pago_deuda') deuda_id = (S.debts.find(d => d.nombre.toLowerCase().split(/\s+/).some(w => w.length > 2 && t.includes(w))) || S.debts[0])?.id || null;
  if (tipo === 'gasto') { const d = S.debts.find(x => /con (la )?tarjeta/.test(t) && /tarjeta|visa|master|amex/i.test(x.nombre)); if (d) deuda_id = d.id; }
  let descripcion = '';
  const en = text.match(/\ben\s+(.+)$/i);
  if (en && (tipo === 'gasto' || tipo === 'ingreso')) { const s = en[1].trim().replace(/\s+(con|por|hoy|ayer)\b.*$/i, ''); if (!categoria || (!KEYWORDS[categoria].includes(s.toLowerCase()) && s.toLowerCase() !== cat(categoria).name.toLowerCase())) descripcion = s[0].toUpperCase() + s.slice(1); }
  return { cents: Math.round(cents), fecha, tipo, categoria, deuda_id, descripcion };
}

async function saveDraft() {
  const d = S.draft, amt = draftCents(d);
  if (!amt || draftError(d)) return;
  const now = new Date();
  const m = { id: uid(), tipo: d.tipo, importe: amt, fecha: d.fecha, hora: `${pad(now.getHours())}:${pad(now.getMinutes())}`, creado: now.toISOString(),
    categoria: (d.tipo === 'gasto' || d.tipo === 'ingreso') ? d.categoria : null, deuda_id: (d.tipo === 'pago_deuda' || d.tipo === 'gasto') ? d.deuda_id : null, descripcion: d.descripcion.trim() || null };
  S.movements.push(m); S.draft = null; closeSheet(); render();
  try { await Store.putMovement(m); toast(TIPOS[m.tipo].saved, () => removeMovement(m.id, true)); }
  catch (e) { S.movements = S.movements.filter(x => x !== m); saveError(e); render(); }
}
async function removeMovement(id, silent) {
  const m = S.movements.find(x => x.id === id); if (!m) return;
  S.movements = S.movements.filter(x => x !== m); render();
  try { await Store.deleteMovement(id); if (!silent) toast('Movimiento eliminado', () => restoreMovement(m)); }
  catch (e) { S.movements.push(m); saveError(e); render(); }
}
async function restoreMovement(m) { S.movements.push(m); render(); try { await Store.putMovement(m); } catch (e) { S.movements = S.movements.filter(x => x !== m); saveError(e); render(); } }

const appEl = document.getElementById('app');
function render() {

    appEl.innerHTML = screenOnboarding();
    document.getElementById('sheet-root').innerHTML = '';

  }
  const r = ROUTES[S.route] || ROUTES.inicio;
  const sub = S.route === 'inicio' ? `<span class="sub">${(s => s[0].toUpperCase() + s.slice(1))(monthLabel(curMonth()))}</span>` : '';
  const tab = (id, icon, label) => `<button class="tab" data-act="go" data-arg="${id}" ${r.tab === id ? 'aria-current="page"' : ''}>${ic(icon, 22)}${label}</button>`;
  const note = Store.mode === 'local' ? `<div class="storage-note">${ic('hdd', 15)}Modo local: tus datos se guardan solo en este navegador.</div>` : Store.mode === 'memory' ? `<div class="storage-note">${ic('alert', 15)}Este navegador no permite guardar: los datos se pierden al cerrar.</div>` : '';
  appEl.innerHTML = `<header class="topbar">${r.back ? `<button class="icon-btn" data-act="go" data-arg="${r.back}" aria-label="Volver">${ic('back', 20)}</button>` : ''}<h1>${r.title}${sub}</h1>
      <button class="icon-btn" data-act="toggleHide" aria-label="${S.hide ? 'Mostrar montos' : 'Ocultar montos'}">${ic(S.hide ? 'eyeOff' : 'eye', 18)}</button></header>
    <main>${S.route === 'inicio' ? note : ''}${r.render()}</main>
    <nav class="tabbar" aria-label="Secciones">${tab('inicio', 'home', 'Inicio')}${tab('movs', 'list', 'Movimientos')}<button class="tab-plus" data-act="openAdd" data-arg="gasto" aria-label="Registrar movimiento"><span>${ic('plus', 28)}</span></button>${tab('analisis', 'bars', 'Análisis')}${tab('mas', 'more', 'Más')}</nav>`;
  renderSheet();
}
function renderSheet() {
  const root = document.getElementById('sheet-root');
  if (!S.draft && !S.detail) { root.innerHTML = ''; return; }
  const scroll = root.querySelector('.sheet')?.scrollTop || 0, fresh = !root.innerHTML;
  root.innerHTML = `<div class="backdrop" data-act="closeSheet" ${fresh ? '' : 'style="animation:none"'}></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Movimiento" ${fresh ? '' : 'style="animation:none"'}>${S.draft ? sheetAdd() : sheetDetail()}</div>`;
  root.querySelector('.sheet').scrollTop = scroll;
}
function closeSheet() { S.draft = null; S.detail = null; S.confirmDel = false; document.getElementById('sheet-root').innerHTML = ''; }

let toastTimer;
function toast(msg, undo) {
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? '<button data-act="undo">Deshacer</button>' : ''}</div>`;
  toast.undo = undo; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; toast.undo = null; }, 5000);
}

const ACTIONS = {
  go(r) { S.route = r; S.csv = null; S.resetOpen = false; S.debtForm = null; closeSheet(); render(); window.scrollTo(0, 0); },
  toggleHide() { S.hide = !S.hide; render(); },
  openAdd(tipo) { S.draft = newDraft(tipo || 'gasto'); S.detail = null; renderSheet(); },
  openPay(id) { S.draft = newDraft('pago_deuda', { deuda_id: id }); renderSheet(); },
  closeSheet() { closeSheet(); },
  dtype(t) { const o = S.draft; S.draft = newDraft(t, { int: o.int, dec: o.dec, descripcion: o.descripcion, fecha: o.fecha, nlp: o.nlp, deuda_id: t === 'pago_deuda' ? (S.debts.length === 1 ? S.debts[0].id : null) : null }); renderSheet(); },
  key(k) {
    const d = S.draft;
    if (k === 'del') { if (d.dec != null) d.dec = d.dec.length ? d.dec.slice(0, -1) : null; else d.int = d.int.slice(0, -1); }
    else if (k === 'dec') { if (d.dec == null) d.dec = ''; }
    else if (d.dec != null) { if (d.dec.length < 2) d.dec += k; }
    else if (d.int.length < 12 && !(d.int === '' && k === '0')) d.int += k;
    renderSheet();
  },
  dcat(id) { S.draft.categoria = S.draft.categoria === id ? null : id; renderSheet(); },
  allCats() { S.draft.allCats = !S.draft.allCats; renderSheet(); },
  dPaga(id) { S.draft.deuda_id = id || null; renderSheet(); },
  dDebt(id) { S.draft.deuda_id = id; renderSheet(); },
  ddate(v) { S.draft.fecha = v; renderSheet(); },
  save() { saveDraft(); },
  openTx(id) { S.detail = id; S.draft = null; S.confirmDel = false; renderSheet(); },
  async setCat(id) { const m = S.movements.find(x => x.id === S.detail); const prev = m.categoria; m.categoria = id; render(); try { await Store.putMovement(m); } catch (e) { m.categoria = prev; saveError(e); render(); } },
  delAsk() { S.confirmDel = true; renderSheet(); },
  delNo() { S.confirmDel = false; renderSheet(); },
  delYes() { const id = S.detail; closeSheet(); removeMovement(id); },
  undo() { const u = toast.undo; document.getElementById('toast-root').innerHTML = ''; toast.undo = null; u?.(); },
  month(arg) { const [k, d] = arg.split(':'); const key = k === 'ana' ? 'anaMonth' : 'movMonth'; const months = monthsSinceStart(); const n = addMonths(S[key] || curMonth(), +d); if (months.includes(n)) S[key] = n; render(); },
  movFilter(f) { S.movFilter = f; render(); },
  // Onboarding
  obCur(c) { S.ob.moneda = c; render(); },
  obBack() { const o = S.ob; o.err = ''; if (o.back) { o.back = false; o.step = 5; } else o.step = Math.max(0, o.step - 1); render(); focusOb(); },
  obHasDebts(v) { S.ob.hasDebts = v === '1'; S.ob.err = ''; render(); if (v === '1') requestAnimationFrame(() => document.getElementById('d-nombre')?.focus()); },
  obAddDebt() { const o = S.ob; const { e, debt } = validateDebtForm(o.form); o.formErr = e; o.err = ''; if (debt) { o.debts.push(debt); o.form = { nombre: '', importe: '', cuota: '', interes: '' }; } render(); if (debt) requestAnimationFrame(() => document.getElementById('d-nombre')?.focus()); },
  obDelDebt(id) { S.ob.debts = S.ob.debts.filter(d => d.id !== id); render(); },
  obEdit(step) { S.ob.step = +step; S.ob.back = true; render(); focusOb(); },
  // Deudas
  debtNew() { S.debtForm = { nombre: '', importe: '', cuota: '', interes: '', err: {} }; render(); requestAnimationFrame(() => document.getElementById('nd-nombre')?.focus()); },
  debtCancel() { S.debtForm = null; render(); },
  async debtSave() {
    const { e, debt } = validateDebtForm(S.debtForm); S.debtForm.err = e;
    if (!debt) return render();
    debt.fecha = today(); S.debts.push(debt); S.debtForm = null; render();
    try { await Store.putDebt(debt); toast('Deuda guardada'); } catch (err) { S.debts = S.debts.filter(x => x !== debt); saveError(err); render(); }
  },
  async debtDel(id) {
    if (debtUsage(id)) return toast('Esta deuda tiene movimientos: eliminá esos movimientos primero.');
    const d = S.debts.find(x => x.id === id); S.debts = S.debts.filter(x => x !== d); render();
    try { await Store.deleteDebt(id); toast('Deuda eliminada'); } catch (err) { S.debts.push(d); saveError(err); render(); }
  },
  // Datos
  async exportCsv() {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const csv = ['fecha,hora,tipo,categoria,descripcion,importe,moneda,deuda',
      ...sortMov(S.movements).map(m => [m.fecha, m.hora, TIPOS[m.tipo].label, cat(m.categoria)?.name || '', m.descripcion || '', (m.importe / 100).toFixed(2), currency(), S.debts.find(d => d.id === m.deuda_id)?.nombre || ''].map(q).join(','))].join('\n');
    const dl = window.claude?.use ? await claude.use('downloads') : null;
    if (dl) { try { await dl.save({ filename: `${APP.name.toLowerCase()}-movimientos-${today()}.csv`, data: csv }); return; } catch (e) { if (e?.code === 'declined') return; } }
    S.csv = csv; render();
  },
  copyCsv() { navigator.clipboard?.writeText(S.csv).then(() => toast('CSV copiado'), () => { const ta = document.getElementById('csv'); ta.focus(); ta.select(); toast('Seleccioné el texto: copialo con Copiar'); }); },
  resetAsk() { S.resetOpen = true; render(); requestAnimationFrame(() => document.getElementById('reset-word')?.focus()); },
  resetNo() { S.resetOpen = false; render(); },
  async resetYes() {
    const w = document.getElementById('reset-word')?.value.trim();
    if (w !== 'REINICIAR') return;
    const btn = document.getElementById('reset-go'); btn.disabled = true; btn.textContent = 'Borrando…';
    try {
      await Store.resetAll();
      Object.assign(S, { profile: null, debts: [], movements: [], ob: newOb(), route: 'inicio', resetOpen: false, csv: null, anaMonth: null, movMonth: null, movQuery: '', movFilter: 'all' });
      render(); window.scrollTo(0, 0); toast('Tus datos se borraron. Empecemos de nuevo.');
    } catch (e) { saveError(e); btn.disabled = false; btn.textContent = 'Borrar todo'; }
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.tagName === 'BUTTON' && el.type !== 'submit') e.preventDefault();
  ACTIONS[el.dataset.act]?.(el.dataset.arg, el, e);
});
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.input;
  if (!k) return;
  if (k === 'movQuery') { S.movQuery = t.value; document.getElementById('movlist').innerHTML = movList(); return; }
  if (k === 'obAmount') {
    S.ob[t.dataset.key] = t.value;
    const p = parseAmount(t.value), msg = document.getElementById('ob-msg');
    msg.outerHTML = amountMsg(t.value);
    t.closest('.money').dataset.invalid = !!p.error;
    document.getElementById('ob-next').disabled = !!p.error;
    return;
  }
  if (k === 'obForm') { S.ob.form[t.dataset.key] = t.value; if (S.ob.formErr[t.dataset.key]) { S.ob.formErr[t.dataset.key] = ''; t.removeAttribute('aria-invalid'); const m = document.querySelector(`[data-err="${t.dataset.key}"]`); if (m) m.textContent = ''; } return; }
  if (k === 'debtForm') { S.debtForm[t.dataset.key] = t.value; return; }
  if (k === 'resetWord') { document.getElementById('reset-go').disabled = t.value.trim() !== 'REINICIAR'; return; }
  if (k === 'valAmount') { const p = parseAmount(t.value), msg = document.getElementById('val-msg'); if (p.error) { msg.className = 'msg err'; msg.textContent = p.error; } else if (!p.empty) { const diff = p.cents - totals().inv; msg.className = 'msg'; msg.textContent = diff === 0 ? 'Sin cambios respecto del valor actual.' : `Se registra una ${diff > 0 ? 'ganancia' : 'pérdida'} de ${fmt(Math.abs(diff), { force: true })}.`; } return; }
  if (S.draft) S.draft[k] = t.value;
});
document.addEventListener('change', async e => {
  if (e.target.dataset.change !== 'currency') return;
  const prev = S.profile.moneda; S.profile.moneda = e.target.value; render();
  try { await Store.saveProfile(); toast(`Moneda: ${S.profile.moneda}`); } catch (err) { S.profile.moneda = prev; saveError(err); render(); }
});
document.addEventListener('submit', async e => {
  const f = e.target.dataset.form; if (!f) return;
  e.preventDefault();
  if (f === 'ob') return obNext();
  if (f === 'valuation') {
    const inp = document.getElementById('val-amount'), p = parseAmount(inp.value);
    if (p.error || p.empty) return toast(p.error || 'Ingresá el valor actual de tus inversiones.');
    const diff = p.cents - totals().inv; if (!diff) return toast('Sin cambios respecto del valor actual.');
    const now = new Date();
    const m = { id: uid(), tipo: 'valuacion', importe: diff, fecha: today(), hora: `${pad(now.getHours())}:${pad(now.getMinutes())}`, creado: now.toISOString(), categoria: null, deuda_id: null, descripcion: 'Actualización de valor' };
    S.movements.push(m); render();
    try { await Store.putMovement(m); toast(TIPOS.valuacion.saved); } catch (err) { S.movements = S.movements.filter(x => x !== m); saveError(err); render(); }
    return;
  }
  if (f === 'nlp') {
    const d = S.draft, p = parseNatural(d.nlp || '');
    if (!p || !p.cents) { d.parsed = null; toast('No encontré un monto. Probá con “gasté 8500 en café”.'); renderSheet(); return; }
    const n = newDraft(p.tipo, { int: String(Math.floor(p.cents / 100)), dec: p.cents % 100 ? pad(p.cents % 100) : null, categoria: p.categoria, deuda_id: p.deuda_id, fecha: p.fecha, descripcion: p.descripcion, nlp: d.nlp });
    const debtName = p.deuda_id ? S.debts.find(x => x.id === p.deuda_id)?.nombre : '';
    n.parsed = `${TIPOS[p.tipo].label} · ${fmt(p.cents, { force: true })}${p.categoria ? ' · ' + cat(p.categoria).name : ''}${debtName ? ' · ' + debtName : ''} · ${dayLabel(p.fecha).toLowerCase()}${p.descripcion ? ' · ' + p.descripcion : ''}`;
    S.draft = n; renderSheet();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.draft || S.detail)) { closeSheet(); return; }
  if (!S.draft || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if (/^[0-9]$/.test(e.key)) ACTIONS.key(e.key);
  else if (e.key === ',' || e.key === '.') ACTIONS.key('dec');
  else if (e.key === 'Backspace') ACTIONS.key('del');
  else if (e.key === 'Enter') saveDraft();
});

const tip = document.getElementById('tip');
function showTip(el, x, y) { tip.textContent = el.dataset.tip; tip.hidden = false; const w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px'; tip.style.top = Math.max(8, y - 44) + 'px'; }
document.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-tip]'); if (el && e.pointerType !== 'mouse') { showTip(el, e.clientX, e.clientY); clearTimeout(showTip.t); showTip.t = setTimeout(() => tip.hidden = true, 2200); } });
document.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

(async () => {
  try { const data = await Store.init(); Object.assign(S, data); }
  catch (e) { console.warn(e); Object.assign(S, Store.loadLocal()); }
  S.loading = false;
  render();
  if (!S.profile?.onboarding_completado) focusOb();
})();
</script>
