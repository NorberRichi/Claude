<title>Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de app (≤440px) con barra de pestañas fija y botón "+" central; en escritorio flota sobre un plano neutro. */
:root {
  --plane: #e9eeec;
  --bg: #f5f8f7;
  --surface: #ffffff;
  --surface-2: #edf1ef;
  --line: #dce3e0;
  --ink: #0f1916;
  --ink-2: #4c5854;
  --muted: #74807b;
  --accent: #26357f;
  --accent-ink: #ffffff;
  --accent-soft: #e5e8f6;
  --good: #0b7a3b;
  --bad: #b8342d;
  /* gráficos (paleta categórica validada, orden fijo) */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --s-rest: #c3c2b7;
  --grid: #e3e8e6;
  /* estado */
  --st-good: #0ca30c; --st-warn: #fab219; --st-serious: #ec835a; --st-critical: #d03b3b;
  --shadow: 0 1px 2px rgba(15,25,22,.04), 0 8px 28px rgba(15,25,22,.08);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plane: #060908; --bg: #0c1110; --surface: #141a18; --surface-2: #1c2421; --line: #27302d;
    --ink: #eef3f1; --ink-2: #b4beba; --muted: #86918d;
    --accent: #a3b0ff; --accent-ink: #0c1110; --accent-soft: #222a4f;
    --good: #45c774; --bad: #ff7b71;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s-rest: #4a4a46;
    --grid: #252d2a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plane: #060908; --bg: #0c1110; --surface: #141a18; --surface-2: #1c2421; --line: #27302d;
  --ink: #eef3f1; --ink-2: #b4beba; --muted: #86918d;
  --accent: #a3b0ff; --accent-ink: #0c1110; --accent-soft: #222a4f;
  --good: #45c774; --bad: #ff7b71;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s-rest: #4a4a46;
  --grid: #252d2a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--plane); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.i { flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }

.proto-note { display: none; }
.app { max-width: 440px; margin: 0 auto; min-height: 100%; background: var(--bg); display: flex; flex-direction: column; position: relative; }
@media (min-width: 720px) {
  body { padding-block: 20px; }
  .proto-note { display: block; max-width: 440px; margin: 0 auto 10px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .app { min-height: calc(100% - 52px); border-radius: 30px; border: 1px solid var(--line); box-shadow: var(--shadow); overflow: clip; }
}

/* Barra superior */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
.topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0; flex: 1; min-width: 0; }
.topbar .sub { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); }
.icon-btn:hover { color: var(--ink); }

main { flex: 1; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* Barra de pestañas */
.tabbar { position: sticky; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--muted); padding: 6px 0 2px; border-radius: 12px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab-plus { display: grid; place-items: center; }
.tab-plus span { width: 56px; height: 56px; margin-top: -26px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 18px color-mix(in oklab, var(--accent) 40%, transparent); transition: transform .15s ease; }
.tab-plus:hover span { transform: translateY(-2px); }

/* Tarjetas y secciones */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sec-head h2 { font-size: 15.5px; font-weight: 600; margin: 0; text-wrap: balance; }
.link { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Hero */
.hero { padding: 6px 2px 2px; }
.hero .label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.hero .big { font-size: clamp(38px, 11vw, 48px); font-weight: 600; letter-spacing: -.025em; line-height: 1.1; margin: 4px 0 8px; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.hero .meta b { font-weight: 600; color: var(--ink); }

/* KPIs */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi:hover { border-color: color-mix(in oklab, var(--accent) 35%, var(--line)); }
.kpi .k-label { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.kpi .k-val { font-size: 19px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.kpi .k-sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.kpi.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
.up-good, .down-good { color: var(--good); }
.up-bad, .down-bad { color: var(--bad); }

/* Distribución */
.dist { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
@media (max-width: 370px) { .dist { grid-template-columns: 1fr; justify-items: center; } }
.donut { width: 132px; height: 132px; display: block; }
.donut .d-top { font-size: 11px; fill: var(--muted); font-family: var(--font); }
.donut .d-big { font-size: 17px; font-weight: 600; fill: var(--ink); font-family: var(--font); }
.legend { display: flex; flex-direction: column; gap: 7px; width: 100%; min-width: 0; }
.lg { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 8px; align-items: center; font-size: 13px; line-height: 1.25; }
.lg .sw { width: 10px; height: 10px; border-radius: 3px; }
.lg .v { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.lg .p { display: inline-block; min-width: 34px; color: var(--muted); font-weight: 500; margin-left: 6px; font-size: 12px; }
.warnline { margin-top: 12px; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }

/* Barras horizontales */
.hbars { display: flex; flex-direction: column; gap: 12px; }
.hbar .top { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 5px; }
.hbar .top .name { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.hbar .top .val { font-weight: 600; font-variant-numeric: tabular-nums; }
.hbar .track { height: 8px; border-radius: 0 4px 4px 0; }
.hbar .track i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.delta { font-size: 11.5px; font-weight: 600; padding: 1px 6px; border-radius: 99px; background: var(--surface-2); font-variant-numeric: tabular-nums; }

/* Observaciones */
.insights { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.insights::-webkit-scrollbar { display: none; }
.ins { scroll-snap-align: start; flex: 0 0 min(78%, 300px); background: var(--accent-soft); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.4; }
.ins .i { color: var(--accent); }
.disclaimer { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

/* Alertas */
.alert { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 12px 14px; background: color-mix(in oklab, var(--st-serious) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--st-serious) 35%, var(--line)); font-size: 13.5px; }
.alert .i { color: var(--st-serious); margin-top: 1px; }
.alert b { font-weight: 600; }

/* Filas de movimientos */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; text-align: left; width: 100%; border-radius: 12px; }
.row + .row { border-top: 1px solid var(--line); }
.row:hover .r-title { color: var(--accent); }
.bubble { width: 40px; height: 40px; border-radius: 13px; background: var(--surface-2); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.r-main { flex: 1; min-width: 0; }
.r-title { font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.r-amt small { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.amt-in { color: var(--good); }
.amt-tr { color: var(--ink-2); }
.day-head { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 14px 2px 4px; }
.day-head:first-child { padding-top: 0; }

/* Chips y segmentos */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { padding: 8px 6px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.monthbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthbar strong { font-size: 15px; font-weight: 600; text-transform: capitalize; }
.monthbar button:disabled { opacity: .3; cursor: default; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; color: var(--muted); }
.search input { border: 0; outline: 0; background: none; padding: 10px 0; width: 100%; color: var(--ink); }

/* Medidores */
.meter { height: 8px; border-radius: 99px; background: color-mix(in oklab, var(--m) 16%, var(--surface-2)); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--m); }
.status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }

/* Listas de "Más" */
.menu { display: flex; flex-direction: column; }
.menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; text-align: left; width: 100%; }
.menu-item + .menu-item { border-top: 1px solid var(--line); }
.menu-item .r-main b { display: block; font-weight: 600; font-size: 14.5px; }
.pill { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px; }
.kv + .kv { border-top: 1px solid var(--line); }
.kv span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.kv.total { border-top: 1.5px solid var(--ink) !important; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; width: 100%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; padding: 12px 16px; font-weight: 600; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: color-mix(in oklab, var(--st-critical) 14%, var(--surface)); color: var(--bad); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.block { width: 100%; }
.switch { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
textarea.csv { width: 100%; min-height: 160px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface-2); color: var(--ink); resize: vertical; }

/* Gráficos SVG */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font); font-size: 10px; fill: var(--muted); }
.chart .end { fill: var(--ink); font-weight: 600; font-size: 10.5px; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: color-mix(in oklab, var(--ink) 5%, transparent); }
.mark { transition: opacity .15s; }
.series-legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.series-legend span { display: inline-flex; align-items: center; gap: 6px; }
.series-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Hoja inferior (carga rápida / detalle) */
.backdrop { position: fixed; inset: 0; background: rgba(6,10,9,.42); z-index: 20; animation: fade .2s ease; }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(440px, 100%); max-height: 94%; overflow-y: auto; z-index: 21; background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .24s cubic-bezier(.2,.8,.2,1); }
.grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 2px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -8px; z-index: 2; background: var(--surface); padding: 8px 0 6px; margin-top: -8px; }
.save-bar { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding: 8px 0 16px; margin-bottom: -16px; z-index: 2; }
.sheet-head h3 { margin: 0; font-size: 17px; font-weight: 700; }
.nlp { display: flex; gap: 8px; align-items: center; background: var(--accent-soft); border-radius: 14px; padding: 4px 4px 4px 12px; }
.nlp input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 8px 0; }
.nlp input::placeholder { color: color-mix(in oklab, var(--accent) 60%, var(--muted)); }
.nlp button { background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 8px 10px; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; }
.parsed { font-size: 12.5px; color: var(--accent); margin-top: -6px; display: flex; gap: 6px; align-items: center; }
.amount-display { display: flex; align-items: baseline; justify-content: center; gap: 8px; padding: 4px 0; }
.amount-display .cur { font-size: 14px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 3px 8px; }
.amount-display .val { font-size: 40px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.amount-display .val.empty { color: var(--muted); }
.convert { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: -10px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { height: 46px; border-radius: 14px; background: var(--surface-2); font-size: 21px; font-weight: 500; display: grid; place-items: center; }
.keypad button:active { background: var(--line); }
.catgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.catbtn { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 2px; border-radius: 14px; font-size: 11.5px; font-weight: 500; color: var(--ink-2); border: 1px solid transparent; background: var(--surface-2); min-width: 0; }
.catbtn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: 2px; }
.catbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.lbl { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; }
.row2 { display: flex; gap: 8px; align-items: center; }
.confirm { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; font-size: 14px; }

/* Toast y tooltip */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 11px 14px; font-size: 13.5px; display: flex; gap: 14px; align-items: center; width: max-content; max-width: min(408px, calc(100% - 32px)); box-shadow: var(--shadow); animation: up .2s ease; }
.toast button { font-weight: 700; color: var(--bg); text-decoration: underline; text-underline-offset: 3px; }
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 500; padding: 6px 9px; border-radius: 8px; max-width: 240px; box-shadow: var(--shadow); }

@keyframes up { from { transform: translate(-50%, 16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
main > * { animation: rise .28s ease both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<p class="proto-note">Prototipo navegable con datos de ejemplo · lo que cargues se pierde al recargar</p>
<div class="app" id="app">
  <header class="topbar" id="topbar"></header>
  <main id="screen" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
</div>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<div class="tip" id="tip" hidden></div>

<script>
/* ============================================================
   Configuración — el nombre de la app vive solo acá
   ============================================================ */

const DIA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

const pad = n => String(n).padStart(2, '0');
const daysIn = ym => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate();
const addMonths = (ym, k) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + k, 1)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}`; };
const addDays = (s, k) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + k); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => (new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5;
const monthName = ym => MES[+ym.slice(5, 7) - 1];
const monthLabel = ym => `${monthName(ym)} ${ym.slice(0, 4)}`;
const monthShort = ym => monthName(ym).slice(0, 3);
const ddmm = s => `${s.slice(8, 10)}/${s.slice(5, 7)}`;
const dayLabel = s => { if (s === TODAY) return 'Hoy'; if (s === addDays(TODAY, -1)) return 'Ayer'; const d = new Date(s + 'T00:00:00Z'); const t = `${DIA[d.getUTCDay()]} ${d.getUTCDate()} de ${MES[d.getUTCMonth()]}`; return t[0].toUpperCase() + t.slice(1); };

const nf0 = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 1 });
const HIDDEN = '••••••';
function fmt(n, cur = 'ARS', opts = {}) {
  if (S.hide && !opts.force) return HIDDEN;
  const sym = cur === 'USD' ? 'US$ ' : '$ ';
  const sign = n < 0 ? '−' : (opts.sign && n > 0 ? '+' : '');
  return sign + sym + nf0.format(Math.abs(Math.round(n)));
}
function fmtC(n, cur = 'ARS') {
  if (S.hide) return '•••';
  const sym = cur === 'USD' ? 'US$ ' : '$ ';
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return `${s}${sym}${nf1.format(a / 1e6)} M`;
  if (a >= 1e3) return `${s}${sym}${nf0.format(a / 1e3)} k`;
  return s + sym + nf0.format(a);
}
const pct = x => `${nf0.format(Math.round(x * 100))}%`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function buildSeed() {
  const rnd = mulberry32(20260929);
  const r = (a, b) => a + rnd() * (b - a);
  const ri = (a, b) => Math.floor(r(a, b + 1));
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const r100 = n => Math.round(n / 100) * 100;
  const tx = []; let n = 0;
  const add = o => { const t = { id: 's' + (++n), currency: 'ARS', source: 'seed', ...o }; if (!t.time) t.time = `${pad(ri(8, 22))}:${pad(ri(0, 59))}`; tx.push(t); return t; };
  const lots = [
    { holding: 'spy', date: '2026-03-31', amount: 950000 }, { holding: 'fci', date: '2026-03-31', amount: 400000 },
    { holding: 'pf', date: '2026-03-31', amount: 600000 }, { holding: 'btc', date: '2026-03-31', amount: 750 },
  ];

  MONTHS.forEach((m, i) => {
    const f = Math.pow(1.022, i);
    const last = m === CUR ? +TODAY.slice(8) : daysIn(m);
    const day = d => `${m}-${pad(Math.min(d, last))}`;
    const any = () => ri(1, last);
    const exp = (cat, amount, account, desc, d, time) => add({ type: 'expense', account, amount: r100(amount), cat, desc, date: day(d), time });

    add({ type: 'income', account: 'banco', amount: r100(1850000 * f), cat: 'sueldo', desc: 'Sueldo', date: day(1), time: '09:10' });
    if (i % 2 === 1) add({ type: 'income', account: 'billetera', amount: r100(280000 * f), cat: 'freelance', desc: 'Proyecto freelance', date: day(14), time: '18:30' });
    const buy = r100(180000 * f);
    add({ type: 'transfer', account: 'banco', amount: buy, to: 'usd', toAmount: Math.round(buy / RATES[m]), toCurrency: 'USD', desc: 'Compra de dólares (MEP)', date: day(2), time: '10:05' });
    const inv = r100(250000 * f);
    add({ type: 'transfer', account: 'banco', amount: inv, to: 'comitente', toAmount: inv, toCurrency: 'ARS', desc: 'Transferencia a comitente', date: day(3), time: '10:20' });
    lots.push({ holding: i % 2 ? 'fci' : 'spy', date: day(3), amount: inv, from: 'comitente' });
    add({ type: 'transfer', account: 'banco', amount: r100(90000 * f), to: 'billetera', toAmount: r100(90000 * f), toCurrency: 'ARS', desc: 'Carga de billetera', date: day(4), time: '11:00' });
    add({ type: 'transfer', account: 'banco', amount: r100(60000 * f), to: 'efectivo', toAmount: r100(60000 * f), toCurrency: 'ARS', desc: 'Retiro en cajero', date: day(7), time: '13:40' });

    exp('hogar', 380000 * f, 'banco', 'Alquiler', 10, '09:30');
    exp('hogar', r(30000, 42000) * f, 'banco', 'Luz y gas', 16);
    exp('salud', 98000 * f, 'banco', 'Prepaga', 12, '08:00');
    exp('vehiculo', 52000 * f, 'banco', 'Seguro del auto', 8, '08:15');
    if (i >= 2) exp('educacion', 45000, 'billetera', 'Curso online', 9);
    for (const s of SUBS) if (s.day && s.day <= last) add({ type: 'expense', account: s.account, amount: s.amount, currency: s.currency, cat: 'suscripciones', desc: s.name, date: day(s.day), time: '06:00', sub: s.id });

    for (let k = 0; k < 5; k++) exp('super', r(38000, 76000) * f, k % 2 ? 'tarjeta' : 'banco', pick(['Supermercado', 'Almacén', 'Verdulería', 'Mayorista']), any());
    for (let k = 0; k < 3; k++) exp('combustible', r(32000, 44000) * f, 'tarjeta', 'Estación de servicio', any());
    for (let k = 0; k < 7; k++) exp('comida', r(7000, 18000) * f, pick(['billetera', 'efectivo']), pick(["McDonald's", 'Rotisería', 'Café', 'Delivery', 'Pizzería', 'Sushi']), any());
    const nSal = m === CUR ? 5 : 3;
    for (let k = 0; k < nSal; k++) exp('salidas', r(20000, 36000) * f, pick(['billetera', 'efectivo', 'tarjeta']), pick(['Bar con amigos', 'Cena afuera', 'Cervecería', 'Boliche']), any());
    for (let k = 0; k < 1 + (i % 2); k++) exp('entretenimiento', r(12000, 24000) * f, 'tarjeta', pick(['Cine', 'Recital', 'Teatro', 'Videojuego']), any());
    for (let k = 0; k < 8; k++) exp('transporte', r(1200, 3500) * f, 'billetera', pick(['Carga SUBE', 'Viaje en app', 'Taxi']), any());
    if (rnd() < 0.5) exp('salud', r(8000, 22000), 'efectivo', 'Farmacia', any());
    if (i === 1 || i === 4) exp('ropa', r(65000, 110000) * f, 'tarjeta', pick(['Zapatillas', 'Campera', 'Ropa']), any());
    if (i === 2) exp('tecnologia', 185000, 'tarjeta', 'Auriculares', any());
    if (i === 3) exp('viajes', 240000, 'tarjeta', 'Escapada de fin de semana', 19);
  });

  // Compra en cuotas: 6 × $145.000 con tarjeta (las futuras quedan programadas)
  const plan = { id: 'p1', desc: 'Heladera', total: 870000, n: 6, account: 'tarjeta', cat: 'hogar', purchase: '2026-07-15' };
  for (let k = 0; k < plan.n; k++) add({ type: 'expense', account: 'tarjeta', amount: plan.total / plan.n, cat: 'hogar', desc: 'Heladera', date: addMonths('2026-07', k) + '-15', time: '17:20', plan: 'p1', inst: k + 1, instTotal: plan.n });

  // Pago del resumen (transferencia, no gasto): el día 5 se paga lo cerrado el 24 del mes anterior
  for (const m of MONTHS) {
    const close = addMonths(m, -1) + '-24', open = addMonths(m, -2) + '-24';
    let ars = 0, usd = 0;
    for (const t of tx) if (t.account === 'tarjeta' && t.type === 'expense' && t.date > open && t.date <= close) t.currency === 'USD' ? usd += t.amount : ars += t.amount;
    if (m === '2026-04') ars = 310000;
    if (ars) add({ type: 'transfer', account: 'banco', amount: ars, to: 'tarjeta', toAmount: ars, toCurrency: 'ARS', desc: 'Pago resumen Visa', date: m + '-05', time: '09:00' });
    if (usd) add({ type: 'transfer', account: 'usd', amount: usd, currency: 'USD', to: 'tarjeta', toAmount: usd, toCurrency: 'USD', desc: 'Pago resumen Visa (dólares)', date: m + '-05', time: '09:01' });
  }
  return { tx, lots, plans: [plan] };
}

  S = {

}

/* ============================================================
   Lógica de dominio (TS puro en la app real)
   ============================================================ */
const acc = id => S.accounts.find(a => a.id === id);
const cat = id => S.categories.find(c => c.id === id);
const rateFor = m => (m >= CUR ? S.rate : RATES[m] || S.rate);
const toARS = (amount, currency, m) => currency === 'USD' ? amount * rateFor(m) : amount;
const posted = t => t.date <= TODAY;

function balances(id, upto = TODAY) {
  const a = acc(id), b = { [a.currency]: a.initial };
  for (const t of S.tx) {
    if (t.date > upto || !posted(t)) continue;
    if (t.account === id) b[t.currency] = (b[t.currency] || 0) + (t.type === 'income' ? 1 : -1) * t.amount;
    if (t.type === 'transfer' && t.to === id) b[t.toCurrency] = (b[t.toCurrency] || 0) + t.toAmount;
  }
  for (const l of S.lots) if (l.from === id && l.date <= upto) b.ARS = (b.ARS || 0) - l.amount;
  return b;
}
const balARS = (id, upto = TODAY) => Object.entries(balances(id, upto)).reduce((s, [c, v]) => s + toARS(v, c, upto.slice(0, 7)), 0);

function holdingStats(h, upto = TODAY) {
  let invested = 0, value = 0;
  for (const l of S.lots) if (l.holding === h.id && l.date <= upto) { invested += l.amount; value += l.amount * Math.pow(1 + h.g, daysBetween(l.date, upto) / 30.44); }
  return { invested, value, gain: value - invested, gainPct: invested ? (value - invested) / invested : 0 };
}

function netWorth(upto = TODAY) {
  const m = upto.slice(0, 7);
  let liquid = 0, savings = 0, invCash = 0;
  for (const a of S.accounts) {
    if (a.type === 'credit_card') continue;
    const v = balARS(a.id, upto);
    if (a.purpose === 'savings') savings += v; else if (a.purpose === 'investment') invCash += v; else liquid += v;
  }
  let holdings = 0;
  for (const h of S.holdings) holdings += toARS(holdingStats(h, upto).value, h.currency, m);
  const card = -balARS('tarjeta', upto);
  let cuotas = 0;
  for (const t of S.tx) if (t.plan && t.date > upto) { const p = S.plans.find(p => p.id === t.plan); if (p && p.purchase <= upto) cuotas += toARS(t.amount, t.currency, m); }
  const assets = liquid + savings + invCash + holdings, liabilities = card + cuotas;
  return { liquid, savings, investments: invCash + holdings, card, cuotas, assets, liabilities, net: assets - liabilities };
}
const monthEnd = m => (m === CUR ? TODAY : `${m}-${daysIn(m)}`);

function monthStats(m) {
  const s = { income: 0, expense: 0, savings: 0, invest: 0, byCat: {}, byGroup: { esencial: 0, ocio: 0, otros: 0 } };
  for (const t of S.tx) {
    if (t.date.slice(0, 7) !== m || !posted(t)) continue;
    if (t.type === 'income') s.income += toARS(t.amount, t.currency, m);
    else if (t.type === 'expense') {
      const v = toARS(t.amount, t.currency, m);
      s.expense += v;
      const k = t.cat || 'none';
      s.byCat[k] = (s.byCat[k] || 0) + v;
      s.byGroup[cat(t.cat)?.group || 'otros'] += v;
    } else if (t.type === 'transfer') {
      const from = acc(t.account), to = acc(t.to);
      for (const p of ['savings', 'investment']) {
        const key = p === 'savings' ? 'savings' : 'invest';
        if (to.purpose === p && from.purpose !== p) s[key] += toARS(t.toAmount, t.toCurrency, m);
        if (from.purpose === p && to.purpose !== p) s[key] -= toARS(t.amount, t.currency, m);
      }
    }
  }
  s.unassigned = s.income - s.expense - s.savings - s.invest;
  s.saveRate = s.income ? (s.income - s.expense) / s.income : 0;
  s.days = m === CUR ? +TODAY.slice(8) : daysIn(m);
  return s;
}

function cardInfo() {
  const c = acc('tarjeta');
  const lastClose = `${CUR}-${pad(c.closing)}`, prevClose = `${addMonths(CUR, -1)}-${pad(c.closing)}`;
  const due = `${addMonths(CUR, 1)}-${pad(c.due)}`;
  let stARS = 0, stUSD = 0, cur = 0, future = 0, futureN = 0;
  for (const t of S.tx) {
    if (t.account !== 'tarjeta' || t.type !== 'expense') continue;
    if (t.date > prevClose && t.date <= lastClose) t.currency === 'USD' ? stUSD += t.amount : stARS += t.amount;
    else if (t.date > lastClose && t.date <= TODAY) cur += toARS(t.amount, t.currency, CUR);
    else if (t.date > TODAY && t.plan) { future += t.amount; futureN++; }
  }
  const debt = -balARS('tarjeta');
  const used = debt + future;
  return { lastClose, due, stARS, stUSD, stTotal: stARS + stUSD * S.rate, cur, future, futureN, debt, used, limit: c.limit, usedPct: used / c.limit };
}

function subsSummary() {
  let month = 0, yearly = 0;
  for (const t of S.tx) if (t.sub && t.date.slice(0, 7) === CUR && posted(t)) month += toARS(t.amount, t.currency, CUR);
  for (const s of S.subs) yearly += toARS(s.amount, s.currency, CUR) * (s.freq === 'Anual' ? 1 : 12);
  return { month, yearly };
}
const nextCharge = s => s.next || (s.day > +TODAY.slice(8) ? `${CUR}-${pad(s.day)}` : `${addMonths(CUR, 1)}-${pad(s.day)}`);

function budgetStatus() {
  const st = monthStats(CUR);
  return S.budgets.map(b => { const spent = st.byCat[b.cat] || 0; return { ...b, spent, p: spent / b.amount }; });
}
const levelOf = p => (p >= 1 ? 'critical' : p >= 0.8 ? 'serious' : 'good');

function insights() {
  const cur = monthStats(CUR), prev = monthStats(addMonths(CUR, -1)), out = [];
  let best = null;
  for (const [k, v] of Object.entries(cur.byCat)) {
    const p = prev.byCat[k] || 0;
    if (v >= 50000 && p > 0) { const d = (v - p) / p; if (!best || d > best.d) best = { k, d }; }
  }
  if (best && best.d > 0.05) out.push({ icon: 'trend', text: `Este mes gastaste <b>${pct(best.d)} más</b> en ${cat(best.k).name.toLowerCase()} que en ${monthName(addMonths(CUR, -1))}.` });
  out.push({ icon: 'sparkles', text: `Tu tasa de ahorro este mes fue del <b>${pct(cur.saveRate)}</b>.` });
  const fuel = cur.byCat.combustible || 0;
  if (cur.expense) out.push({ icon: 'fuel', text: `Combustible representa el <b>${pct(fuel / cur.expense)}</b> de tus gastos del mes.` });
  out.push({ icon: 'repeat', text: `Tus suscripciones suman aproximadamente <b>${fmt(subsSummary().yearly)}</b> al año.` });
  const avg = [1, 2, 3].reduce((s, k) => s + (monthStats(addMonths(CUR, -k)).byCat.salidas || 0), 0) / 3;
  out.push({ icon: 'beer', text: `Tu gasto promedio en salidas durante los últimos 3 meses fue de <b>${fmt(avg)}</b>.` });
  return out;
}

function catUsage(kind) {
  const count = {};
  for (const t of S.tx) if (t.type === kind && t.cat) count[t.cat] = (count[t.cat] || 0) + 1;
  return S.categories.filter(c => c.kind === kind).sort((a, b) => (count[b.id] || 0) - (count[a.id] || 0));
}

/* ============================================================
   Gráficos (SVG propio, escala única)
   ============================================================ */
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))); const m = x / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
function niceTicks(lo, hi, n = 4) { const step = niceStep((hi - lo) / n || 1); const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step; const t = []; for (let v = a; v <= b + step / 2; v += step) t.push(v); return t; }

function donut(segs, top, big) {
  const R = 62, C = 2 * Math.PI * R, total = segs.reduce((s, x) => s + x.value, 0) || 1;
  const gap = segs.length > 1 ? 2.5 : 0; let accu = 0;
  const arcs = segs.map(s => {
    const len = s.value / total * C;
    const el = `<circle class="mark" r="${R}" cx="80" cy="80" fill="none" style="stroke:${s.color}" stroke-width="22" stroke-dasharray="${Math.max(len - gap, 0.01)} ${C}" stroke-dashoffset="${-accu}" transform="rotate(-90 80 80)" data-tip="${esc(s.label)} · ${esc(fmt(s.value))} · ${pct(s.value / total)}"></circle>`;
    accu += len; return el;
  }).join('');
  return `<svg class="donut" viewBox="0 0 160 160" role="img" aria-label="Distribución del ingreso">${arcs}<text class="d-top" x="80" y="74" text-anchor="middle">${esc(top)}</text><text class="d-big" x="80" y="95" text-anchor="middle">${esc(big)}</text></svg>`;
}

function columns(groups, series, cur = 'ARS') {
  const W = 340, H = 190, L = 46, R = 6, T = 10, B = 24, pw = W - L - R, ph = H - T - B;
  const ticks = niceTicks(0, Math.max(1, ...groups.flatMap(g => g.values)));
  const max = ticks[ticks.length - 1];
  const y = v => T + ph - v / max * ph;
  const band = pw / groups.length, bw = Math.min(16, (band - 14) / series.length);
  let s = ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${esc(fmtC(t, cur))}</text>`).join('');
  groups.forEach((g, i) => {
    const x0 = L + i * band + band / 2 - (bw * series.length + 2 * (series.length - 1)) / 2;
    g.values.forEach((v, k) => {
      const h = Math.max(v / max * ph, 0), x = x0 + k * (bw + 2), yb = T + ph, yt = yb - h, r = Math.min(4, h, bw / 2);
      if (h > 0) s += `<path class="mark" style="fill:${series[k].color}" d="M${x},${yb} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${yb} Z"/>`;
    });
    s += `<text x="${L + i * band + band / 2}" y="${H - 6}" text-anchor="middle">${esc(g.label)}</text>`;
    s += `<rect class="hit" x="${L + i * band}" y="${T}" width="${band}" height="${ph}" rx="6" data-tip="${esc(g.tip)}"/>`;
  });
  s += `<line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="var(--line)" stroke-width="1"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">${s}</svg>`;
}

function lineChart(points, color) {
  const W = 340, H = 180, L = 48, R = 50, T = 14, B = 24, pw = W - L - R, ph = H - T - B;
  const vals = points.map(p => p.value);
  const ticks = niceTicks(Math.min(...vals) * 0.97, Math.max(...vals) * 1.01);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const x = i => L + (points.length === 1 ? pw / 2 : i / (points.length - 1) * pw);
  const y = v => T + ph - (v - lo) / (hi - lo) * ph;
  let s = ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${esc(fmtC(t))}</text>`).join('');
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  s += `<path d="${d} L${x(points.length - 1)},${T + ph} L${x(0)},${T + ph} Z" style="fill:${color};opacity:.1"/>`;
  s += `<path d="${d}" fill="none" style="stroke:${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const li = points.length - 1;
  s += `<circle cx="${x(li)}" cy="${y(points[li].value)}" r="4.5" style="fill:${color};stroke:var(--surface)" stroke-width="2"/>`;
  s += `<text class="end" x="${x(li) + 8}" y="${y(points[li].value) + 4}">${esc(fmtC(points[li].value))}</text>`;
  points.forEach((p, i) => {
    s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(p.label)}</text>`;
    const w = pw / Math.max(points.length - 1, 1);
    s += `<rect class="hit" x="${x(i) - w / 2}" y="${T}" width="${w}" height="${ph}" rx="6" data-tip="${esc(p.tip)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del patrimonio">${s}</svg>`;
}

function hbars(items, max, withDelta) {
  return `<div class="hbars">${items.map(it => `
    <div class="hbar" data-tip="${esc(it.name)} · ${esc(fmt(it.value, it.cur))}${it.share != null ? ' · ' + pct(it.share) + ' del gasto' : ''}">
      <div class="top"><span class="name">${ic(it.icon, 16)}<span>${esc(it.name)}</span>${withDelta && it.delta != null ? deltaChip(it.delta, true) : ''}</span><span class="val">${fmt(it.value, it.cur)}</span></div>
      <div class="track"><i style="width:${Math.max(0.5, it.value / max * 100)}%"></i></div>
    </div>`).join('')}</div>`;
}
function deltaChip(d, upIsBad) {
  if (!isFinite(d)) return '';
  const up = d >= 0, cls = up ? (upIsBad ? 'up-bad' : 'up-good') : (upIsBad ? 'down-good' : 'down-bad');
  return `<span class="delta ${cls}">${up ? '▲' : '▼'} ${pct(Math.abs(d))}</span>`;
}

/* ============================================================
   Componentes
   ============================================================ */
function txRow(t) {
  const c = cat(t.cat), a = acc(t.account);
  let icon = c?.icon || 'shapes', title = t.desc || c?.name || 'Sin categoría', sub, amt, cls = '';
  if (t.type === 'transfer') {
    icon = 'transfer';
    sub = `${acc(t.account).short} → ${acc(t.to).short}`;
    amt = fmt(t.amount, t.currency); cls = 'amt-tr';
    if (t.toCurrency !== t.currency) amt += `<small>${fmt(t.toAmount, t.toCurrency)}</small>`;
  } else {
    sub = `${c ? c.name : 'Sin categoría'} · ${a.short}${t.inst ? ` · cuota ${t.inst}/${t.instTotal}` : ''}`;
    const sign = t.type === 'income' ? 1 : -1;
    amt = fmt(sign * t.amount, t.currency, { sign: true }); cls = t.type === 'income' ? 'amt-in' : '';
    if (t.currency === 'USD') amt += `<small>≈ ${fmt(toARS(t.amount, 'USD', t.date.slice(0, 7)))}</small>`;
  }
  return `<button class="row" data-act="openTx" data-arg="${t.id}">
    <span class="bubble">${ic(icon, 19)}</span>
    <span class="r-main"><span class="r-title" style="display:block">${esc(title)}</span><span class="r-sub" style="display:block">${esc(sub)}</span></span>
    <span class="r-amt ${cls}">${amt}</span></button>`;
}
const sortTx = list => list.slice().sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time) || b.id.localeCompare(a.id));

function monthBar(key, m, min = MONTHS[0]) {
  return `<div class="monthbar">
    <button class="icon-btn" data-act="month" data-arg="${key}:-1" ${m <= min ? 'disabled' : ''} aria-label="Mes anterior">${ic('prev', 18)}</button>
    <strong>${monthLabel(m)}</strong>
    <button class="icon-btn" data-act="month" data-arg="${key}:1" ${m >= CUR ? 'disabled' : ''} aria-label="Mes siguiente">${ic('next', 18)}</button></div>`;
}

const GROUPS = [
  { key: 'esencial', label: 'Gastos esenciales', color: 'var(--s1)' },
  { key: 'ocio', label: 'Ocio', color: 'var(--s2)' },
  { key: 'otros', label: 'Otros gastos', color: 'var(--s3)' },
  { key: 'savings', label: 'Ahorro', color: 'var(--s4)' },
  { key: 'invest', label: 'Inversión', color: 'var(--s5)' },
  { key: 'unassigned', label: 'Sin asignar', color: 'var(--s-rest)' },
];
function distribution(st) {
  const vals = { esencial: st.byGroup.esencial, ocio: st.byGroup.ocio, otros: st.byGroup.otros, savings: Math.max(st.savings, 0), invest: Math.max(st.invest, 0), unassigned: Math.max(st.unassigned, 0) };
  const segs = GROUPS.map(g => ({ ...g, value: vals[g.key] })).filter(s => s.value > 0);
  const base = Math.max(st.income, 1);
  return `<div class="dist">${donut(segs, 'Ingresos', fmtC(st.income))}
    <div class="legend">${segs.map(s => `<div class="lg"><i class="sw" style="background:${s.color}"></i><span>${s.label}</span><span class="v">${fmtC(s.value)}<span class="p">${pct(s.value / base)}</span></span></div>`).join('')}</div></div>
    ${st.unassigned < 0 ? `<div class="warnline">${ic('alert', 16)}<span>Este mes salió <b>${fmt(-st.unassigned)}</b> más de lo que ingresó.</span></div>` : ''}`;
}

function screenMovs() {
  const m = S.movMonth;
  return `${monthBar('mov', m)}
  <label class="search">${ic('search', 18)}<input id="mov-q" type="search" placeholder="Buscar por descripción o categoría" value="${esc(S.movQuery)}" data-input="movQuery" autocomplete="off"></label>
  <div class="chips" role="group" aria-label="Filtrar">${[['all', 'Todos'], ['expense', 'Gastos'], ['income', 'Ingresos'], ['transfer', 'Transferencias']].map(([k, l]) => `<button class="chip" data-act="movFilter" data-arg="${k}" aria-pressed="${S.movFilter === k}">${l}</button>`).join('')}</div>
  <section class="card" id="movlist">${movList()}</section>`;
}
function movList() {
  const q = S.movQuery.trim().toLowerCase();
  const list = sortTx(S.tx.filter(t => t.date.slice(0, 7) === S.movMonth && posted(t) && (S.movFilter === 'all' || t.type === S.movFilter) &&
    (!q || (t.desc || '').toLowerCase().includes(q) || (cat(t.cat)?.name || '').toLowerCase().includes(q))));
  if (!list.length) return `<p class="muted" style="margin:6px 0;text-align:center">No hay movimientos con ese filtro.</p>`;
  const tot = list.reduce((s, t) => s + (t.type === 'expense' ? -1 : t.type === 'income' ? 1 : 0) * toARS(t.amount, t.currency, S.movMonth), 0);
  let html = `<p class="small muted" style="margin:0 0 6px">${list.length} movimientos · neto ${fmt(tot, 'ARS', { sign: true })}</p>`, day = null, buf = [];
  const flush = () => { if (!buf.length) return; const net = buf.reduce((s, t) => s + (t.type === 'expense' ? -1 : t.type === 'income' ? 1 : 0) * toARS(t.amount, t.currency, S.movMonth), 0); html += `<div class="day-head"><span>${dayLabel(day)}</span><span class="num">${net ? fmt(net, 'ARS', { sign: true }) : ''}</span></div><div class="rows">${buf.map(txRow).join('')}</div>`; buf = []; };
  for (const t of list) { if (t.date !== day) { flush(); day = t.date; } buf.push(t); }
  flush();
  return html;
}

function screenAnalisis() {

  const groups = MONTHS.filter(x => x <= m).slice(-6).map(x => { const s = monthStats(x); return { label: monthShort(x), values: [cv(s.income, x), cv(s.expense, x)], tip: `${monthLabel(x)} · Ingresos ${fmt(cv(s.income, x), cu)} · Gastos ${fmt(cv(s.expense, x), cu)}` }; });
  const kpi = (label, v, dv, upBad, sub) => `<div class="kpi"><span class="k-label">${label}</span><span class="k-val">${v}</span><span class="k-sub">${dv != null ? deltaChip(dv, upBad) + (prev ? ` vs. ${monthShort(pm)}` : '') : sub || ''}</span></div>`;

  <div class="seg" role="group" aria-label="Moneda"><button data-act="anaCur" data-arg="ARS" aria-pressed="${cu === 'ARS'}">Ver en pesos</button><button data-act="anaCur" data-arg="USD" aria-pressed="${cu === 'USD'}">Ver en dólares (MEP)</button></div>
  <section class="kpis">
    ${kpi('Gastos', fmt(cv(st.expense), cu), prev ? d(cv(st.expense), cv(prev.expense, pm)) : null, true)}
    ${kpi('Ingresos', fmt(cv(st.income), cu), prev ? d(cv(st.income), cv(prev.income, pm)) : null, false)}
    ${kpi('Ahorro', fmt(cv(st.income - st.expense), cu), null, false, `Tasa ${pct(st.saveRate)}`)}
    ${kpi('Promedio diario', fmt(cv(st.expense) / st.days, cu), null, false, `${st.days} días${m === CUR ? ' (mes en curso)' : ''}`)}
  </section>
  <section class="card">
    <div class="sec-head"><h2>Gasto por categoría</h2><span class="small muted">vs. ${monthShort(pm)}</span></div>
    ${cats.length ? hbars(cats.map(([k, v]) => ({ name: cat(k)?.name || 'Sin categoría', icon: cat(k)?.icon || 'shapes', value: cv(v), cur: cu, share: v / st.expense, delta: prev && prev.byCat[k] ? d(cv(v), cv(prev.byCat[k], pm)) : null })), cv(cats[0][1]), true) : '<p class="muted">Sin gastos este mes.</p>'}
  </section>
  <section class="card">
    <div class="sec-head"><h2>Ingresos vs. gastos</h2><span class="small muted">Últimos meses</span></div>
    <div class="series-legend"><span><i style="background:var(--s1)"></i>Ingresos</span><span><i style="background:var(--s2)"></i>Gastos</span></div>
    ${columns(groups, [{ color: 'var(--s1)' }, { color: 'var(--s2)' }], cu)}
  </section>
  <section class="card">
    <div class="sec-head"><h2>Distribución del ingreso</h2></div>
    ${distribution(st)}
  </section>
  <p class="disclaimer" style="padding-inline:2px">Los montos en pesos son nominales. Con inflación, compararlos en dólares da una idea más real de la variación. Cotización MEP usada: ${fmt(rateFor(m), 'ARS', { force: true })}.</p>`;
}

  return `<section class="card">
    <p class="small muted" style="margin:0">Patrimonio neto hoy</p>
    <p style="font-size:30px;font-weight:600;letter-spacing:-.02em;margin:2px 0 6px">${fmt(nw.net)}</p>
    <p class="small" style="margin:0 0 12px;display:flex;gap:8px;align-items:center">${deltaChip(dv / prev, false)}<span class="muted">${fmt(dv, 'ARS', { sign: true })} vs. fin de ${monthName(addMonths(CUR, -1))}</span></p>

function screenInversiones() {
  let inv = 0, val = 0;
  const rows = S.holdings.map(h => { const s = holdingStats(h); inv += toARS(s.invested, h.currency, CUR); val += toARS(s.value, h.currency, CUR); return { h, s }; });
  const g = val - inv;
  return `<section class="kpis">
    <div class="kpi"><span class="k-label">Capital invertido</span><span class="k-val">${fmt(inv)}</span></div>

    <div class="kpi wide"><span class="k-label">Ganancia / pérdida</span><span class="k-val ${g >= 0 ? 'up-good' : 'down-bad'}">${fmt(g, 'ARS', { sign: true })} <span class="small">(${pct(g / inv)})</span></span></div>
  </section>
  <section class="card"><div class="sec-head"><h2>Posiciones</h2><span class="small muted">Carga manual</span></div><div class="rows">
    ${rows.map(({ h, s }) => `<div class="row"><span class="bubble">${ic(h.currency === 'USD' ? 'coins' : 'candle', 19)}</span><span class="r-main"><span class="r-title" style="display:block">${esc(h.name)}</span><span class="r-sub" style="display:block">${h.type} · invertido ${fmt(s.invested, h.currency)}</span></span><span class="r-amt">${fmt(s.value, h.currency)}<small class="${s.gain >= 0 ? 'up-good' : 'down-bad'}">${s.gain >= 0 ? '▲' : '▼'} ${pct(Math.abs(s.gainPct))}</small></span></div>`).join('')}

/* ============================================================

function newDraft(type = 'expense') {
  return { type, amount: '', currency: 'ARS', cat: null, account: type === 'income' ? S.last.income : S.last.expense, from: 'banco', to: 'usd', date: TODAY, desc: '', cuotas: 1, allCats: false, nlp: '', parsed: null };
}
const accountsFor = d => S.accounts.filter(a => d.type === 'income' ? a.type !== 'credit_card' && a.purpose !== 'investment' : d.type === 'expense' ? (a.purpose === 'spending' || a.type === 'credit_card' || a.type === 'savings') : true)
  .filter(a => d.type === 'transfer' || a.currency === d.currency || (a.type === 'credit_card' && d.type === 'expense'));

function sheetAdd() {
  const d = S.draft, amt = +d.amount || 0;
  const cur = d.type === 'transfer' ? acc(d.from).currency : d.currency;
  let convert = '';
  if (d.type === 'transfer') {
    const fc = acc(d.from).currency, tc = acc(d.to).currency;
    if (fc !== tc && amt) convert = `<p class="convert">Recibís ≈ ${fmt(fc === 'ARS' ? amt / S.rate : amt * S.rate, tc, { force: true })} · MEP ${fmt(S.rate, 'ARS', { force: true })}</p>`;
  } else if (cur === 'USD' && amt) convert = `<p class="convert">≈ ${fmt(amt * S.rate, 'ARS', { force: true })}</p>`;
  const cats = catUsage(d.type === 'income' ? 'income' : 'expense');
  const shown = d.allCats ? cats : cats.slice(0, 8);
  const accs = accountsFor(d);
  const typeLabel = { expense: 'gasto', income: 'ingreso', transfer: 'transferencia' }[d.type];
  const isCard = d.type === 'expense' && d.account === 'tarjeta';
  return `<div class="grab"></div>
  <div class="sheet-head"><h3>Nuevo movimiento</h3><button class="icon-btn" data-act="closeSheet" aria-label="Cerrar">${ic('x', 18)}</button></div>
  <form class="nlp" data-form="nlp"><input id="nlp" placeholder="Probá: hoy gasté 15 mil en combustible" value="${esc(d.nlp)}" data-input="nlp" autocomplete="off"><button type="submit">${ic('mic', 15)}Interpretar</button></form>
  ${d.parsed ? `<p class="parsed">${ic('check', 14)}${esc(d.parsed)}</p>` : ''}
  <div class="seg" role="group" aria-label="Tipo">${[['expense', 'Gasto'], ['income', 'Ingreso'], ['transfer', 'Transferencia']].map(([k, l]) => `<button data-act="dtype" data-arg="${k}" aria-pressed="${d.type === k}">${l}</button>`).join('')}</div>
  <div class="amount-display"><button class="cur" data-act="dcur" ${d.type === 'transfer' ? 'disabled' : ''} aria-label="Cambiar moneda">${cur === 'USD' ? 'US$' : '$'} ${cur}</button><span class="val ${amt ? '' : 'empty'}">${amt ? nf0.format(amt) : '0'}</span></div>
  ${convert}
  <div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '000', '0', 'del'].map(k => `<button data-act="key" data-arg="${k}" aria-label="${k === 'del' ? 'Borrar' : k}">${k === 'del' ? ic('del', 22) : k}</button>`).join('')}</div>
  ${d.type !== 'transfer' ? `<div><span class="lbl">Categoría</span><div class="catgrid">${shown.map(c => `<button class="catbtn" data-act="dcat" data-arg="${c.id}" aria-pressed="${d.cat === c.id}">${ic(c.icon, 20)}<span>${c.name}</span></button>`).join('')}</div>
    ${cats.length > 8 ? `<button class="link" style="margin-top:8px" data-act="allCats">${d.allCats ? 'Ver menos' : `Ver todas (${cats.length})`}</button>` : ''}</div>
    <div><span class="lbl">${d.type === 'income' ? 'Cuenta de destino' : 'Cuenta o tarjeta'}</span><div class="chips">${accs.map(a => `<button class="chip" data-act="dacc" data-arg="${a.id}" aria-pressed="${d.account === a.id}">${ic(a.icon, 15)}${a.short}</button>`).join('')}</div></div>
    ${isCard ? `<div><span class="lbl">Cuotas</span><div class="chips">${[1, 3, 6, 12].map(n => `<button class="chip" data-act="dcuotas" data-arg="${n}" aria-pressed="${d.cuotas === n}">${n === 1 ? '1 pago' : `${n} cuotas`}</button>`).join('')}</div>${d.cuotas > 1 && amt ? `<p class="small muted" style="margin:6px 0 0">${d.cuotas} cuotas de ${fmt(Math.round(amt / d.cuotas), cur, { force: true })}. Las futuras quedan programadas y cuentan como deuda.</p>` : ''}</div>` : ''}`
  : `<div><span class="lbl">Desde</span><div class="chips">${S.accounts.filter(a => a.type !== 'credit_card').map(a => `<button class="chip" data-act="dfrom" data-arg="${a.id}" aria-pressed="${d.from === a.id}">${ic(a.icon, 15)}${a.short}</button>`).join('')}</div></div>
    <div><span class="lbl">Hacia</span><div class="chips">${S.accounts.filter(a => a.id !== d.from).map(a => `<button class="chip" data-act="dto" data-arg="${a.id}" aria-pressed="${d.to === a.id}">${ic(a.icon, 15)}${a.short}</button>`).join('')}</div></div>`}
  <div class="row2"><div class="chips" style="flex:none">${[[TODAY, 'Hoy'], [addDays(TODAY, -1), 'Ayer']].map(([v, l]) => `<button class="chip" data-act="ddate" data-arg="${v}" aria-pressed="${d.date === v}">${ic('calendar', 15)}${l}</button>`).join('')}</div>
    <input class="input" id="desc" placeholder="Descripción (opcional)" value="${esc(d.desc)}" data-input="desc" autocomplete="off" style="min-width:0"></div>
  <div class="save-bar"><button class="btn primary block" data-act="save" ${amt > 0 ? '' : 'disabled'}>Guardar ${typeLabel}</button></div>`;
}

const KEYWORDS = {
  combustible: ['nafta', 'combustible', 'gasoil', 'ypf', 'shell', 'axion', 'cargué'], comida: ['comida', 'almuerzo', 'cena', 'mcdonald', 'burger', 'pizza', 'delivery', 'café', 'cafe', 'sushi', 'empanadas'],
  super: ['super', 'supermercado', 'chino', 'almacén', 'almacen', 'verdulería', 'verduleria', 'mayorista'], transporte: ['uber', 'taxi', 'sube', 'colectivo', 'subte', 'tren', 'cabify', 'didi'],
  salidas: ['bar', 'birra', 'cerveza', 'salida', 'boliche', 'fernet', 'tragos'], entretenimiento: ['cine', 'recital', 'juego', 'teatro', 'steam', 'entradas'],
  ropa: ['ropa', 'zapatillas', 'remera', 'jean', 'campera'], tecnologia: ['celular', 'auriculares', 'compu', 'notebook', 'cargador'],
  salud: ['farmacia', 'médico', 'medico', 'prepaga', 'remedio', 'dentista'], hogar: ['alquiler', 'expensas', 'luz', 'gas', 'agua', 'internet'],
  vehiculo: ['seguro', 'mecánico', 'mecanico', 'patente', 'lavadero', 'service'], viajes: ['vuelo', 'hotel', 'pasaje', 'viaje'],
  suscripciones: ['netflix', 'spotify', 'suscripción', 'suscripcion'], sueldo: ['sueldo', 'salario', 'aguinaldo'], freelance: ['freelance', 'proyecto', 'cliente', 'honorarios'],
  regalos: ['regalo', 'regalaron'], ventas: ['vendí', 'vendi', 'venta'],
};
function parseNatural(text) {
  const t = text.toLowerCase().normalize('NFC');
  const m = t.match(/(\d{1,3}(?:\.\d{3})+|\d+(?:,\d+)?)\s*(mil|k\b|lucas?|palos?|millones?|millón)?/);
  if (!m) return null;
  let amount = parseFloat(m[1].replace(/\./g, '').replace(',', '.'));
  if (m[2]) amount *= /^(mil|k|luca)/.test(m[2]) ? 1e3 : 1e6;
  const currency = /(d[oó]lar|usd|u\$s|us\$|verdes)/.test(t) ? 'USD' : 'ARS';
  const date = /anteayer/.test(t) ? addDays(TODAY, -2) : /ayer/.test(t) ? addDays(TODAY, -1) : TODAY;
  const type = /(cobr[eé]|recib[ií]|ingres|me pagaron|me depositaron|vend[ií])/.test(t) ? 'income' : 'expense';
  let catId = null;
  for (const [k, words] of Object.entries(KEYWORDS)) if (cat(k)?.kind === type && words.some(w => t.includes(w))) { catId = k; break; }
  let desc = '';
  const en = text.match(/\ben\s+(.+)$/i);
  if (en) { const d = en[1].trim().replace(/\s+(con|por|hoy|ayer)\b.*$/i, ''); if (!catId || !KEYWORDS[catId].some(w => d.toLowerCase() === w) && d.toLowerCase() !== cat(catId).name.toLowerCase()) desc = d[0].toUpperCase() + d.slice(1); }
  return { amount: Math.round(amount), currency, date, type, cat: catId, desc };
}

function saveDraft() {
  const d = S.draft, amt = +d.amount;
  if (!amt) return;
  const mk = o => ({ id: 'u' + (++S.seq), source: 'quick', time: new Date().toTimeString().slice(0, 5), ...o });
  const created = [];
  const before = budgetStatus();
  if (d.type === 'transfer') {
    const fc = acc(d.from).currency, tc = acc(d.to).currency;
    created.push(mk({ type: 'transfer', account: d.from, amount: amt, currency: fc, to: d.to, toAmount: fc === tc ? amt : Math.round(fc === 'ARS' ? amt / S.rate : amt * S.rate), toCurrency: tc, desc: d.desc || 'Transferencia', date: d.date }));
  } else if (d.type === 'expense' && d.account === 'tarjeta' && d.cuotas > 1) {
    const pid = 'up' + (++S.seq);
    S.plans.push({ id: pid, desc: d.desc, total: amt, n: d.cuotas, account: 'tarjeta', cat: d.cat, purchase: d.date });
    for (let k = 0; k < d.cuotas; k++) created.push(mk({ type: 'expense', account: 'tarjeta', amount: Math.round(amt / d.cuotas), currency: d.currency, cat: d.cat, desc: d.desc, date: addMonths(d.date.slice(0, 7), k) + d.date.slice(7), plan: pid, inst: k + 1, instTotal: d.cuotas }));
  } else {
    created.push(mk({ type: d.type, account: d.account, amount: amt, currency: d.currency, cat: d.cat, desc: d.desc, date: d.date }));
    S.last[d.type] = d.account;
  }
  S.tx.push(...created);
  S.draft = null;
  closeSheet();
  const after = budgetStatus();
  const crossed = after.find((b, i) => b.cat === d.cat && before[i].p < 0.8 && b.p >= 0.8);
  const label = { expense: 'Gasto guardado', income: 'Ingreso guardado', transfer: 'Transferencia guardada' }[d.type];
  toast(crossed ? `Atención: ya utilizaste el ${pct(crossed.p)} de tu presupuesto de ${cat(crossed.cat).name.toLowerCase()}.` : label, () => { S.tx = S.tx.filter(t => !created.includes(t)); render(); });
  render();
}

function sheetDetail() {
  const t = S.tx.find(x => x.id === S.detail);
  if (!t) return '';
  const c = cat(t.cat);
  const typeName = { expense: 'Gasto', income: 'Ingreso', transfer: 'Transferencia' }[t.type];
  const amount = t.type === 'transfer' ? fmt(t.amount, t.currency) : fmt((t.type === 'income' ? 1 : -1) * t.amount, t.currency, { sign: true });
  const cats = S.categories.filter(x => x.kind === (t.type === 'income' ? 'income' : 'expense'));
  return `<div class="grab"></div>
  <div class="sheet-head"><h3>${typeName}</h3><button class="icon-btn" data-act="closeSheet" aria-label="Cerrar">${ic('x', 18)}</button></div>
  <div style="text-align:center"><div class="amount-display"><span class="val ${t.type === 'income' ? 'amt-in' : ''}">${amount}</span></div><p class="muted" style="margin:0">${esc(t.desc || c?.name || '')}</p></div>
  <div>
    <div class="kv"><span>Fecha</span><span>${dayLabel(t.date)} · ${t.time}</span></div>
    ${t.type === 'transfer' ? `<div class="kv"><span>Desde</span><span>${acc(t.account).name}</span></div><div class="kv"><span>Hacia</span><span>${acc(t.to).name}${t.toCurrency !== t.currency ? ` · ${fmt(t.toAmount, t.toCurrency)}` : ''}</span></div>`
      : `<div class="kv"><span>Cuenta</span><span>${acc(t.account).name}</span></div>`}
    ${t.inst ? `<div class="kv"><span>Cuota</span><span>${t.inst} de ${t.instTotal}</span></div>` : ''}
    ${t.sub ? `<div class="kv"><span>Origen</span><span>Suscripción</span></div>` : ''}
    ${t.type !== 'transfer' ? `<div class="kv"><span>Categoría</span><span>${c ? c.name : 'Sin categoría'}</span></div>` : ''}
  </div>
  ${t.type !== 'transfer' ? `<div><span class="lbl">Cambiar categoría</span><div class="catgrid">${cats.map(x => `<button class="catbtn" data-act="setCat" data-arg="${x.id}" aria-pressed="${t.cat === x.id}">${ic(x.icon, 18)}<span>${x.name}</span></button>`).join('')}</div></div>` : ''}
  ${S.confirmDel ? `<div class="confirm"><span>¿Eliminar este movimiento?</span><span class="row2"><button class="btn" data-act="delNo">Cancelar</button><button class="btn danger" data-act="delYes">Eliminar</button></span></div>`
    : `<button class="btn danger block" data-act="delAsk">${ic('trash', 18)}Eliminar</button>`}`;
}

/* ============================================================
   Render y eventos
   ============================================================ */
function render() {
  const r = ROUTES[S.route];
  const sub = S.route === 'inicio' ? `<span class="sub">${monthLabel(CUR)[0].toUpperCase() + monthLabel(CUR).slice(1)}</span>` : '';
  document.getElementById('topbar').innerHTML = `${r.back ? `<button class="icon-btn" data-act="go" data-arg="${r.back}" aria-label="Volver">${ic('back', 20)}</button>` : ''}<h1>${r.title}${sub}</h1>
    <button class="icon-btn" data-act="toggleHide" aria-label="${S.hide ? 'Mostrar montos' : 'Ocultar montos'}">${ic(S.hide ? 'eyeOff' : 'eye', 18)}</button>`;
  document.getElementById('screen').innerHTML = r.render();
  const tab = (id, icon, label) => `<button class="tab" data-act="go" data-arg="${id}" ${r.tab === id ? 'aria-current="page"' : ''}>${ic(icon, 22)}${label}</button>`;
  document.getElementById('tabbar').innerHTML = `${tab('inicio', 'home', 'Inicio')}${tab('movs', 'list', 'Movimientos')}<button class="tab-plus" data-act="openAdd" aria-label="Registrar movimiento"><span>${ic('plus', 28)}</span></button>${tab('analisis', 'bars', 'Análisis')}${tab('mas', 'more', 'Más')}`;
  renderSheet();
}
function renderSheet() {
  const root = document.getElementById('sheet-root');
  if (!S.draft && !S.detail) { root.innerHTML = ''; return; }
  const scroll = root.querySelector('.sheet')?.scrollTop || 0;
  const fresh = !root.innerHTML;
  root.innerHTML = `<div class="backdrop" data-act="closeSheet" ${fresh ? '' : 'style="animation:none"'}></div><div class="sheet" role="dialog" aria-modal="true" ${fresh ? '' : 'style="animation:none"'}>${S.draft ? sheetAdd() : sheetDetail()}</div>`;
  root.querySelector('.sheet').scrollTop = scroll;
}
function closeSheet() { S.draft = null; S.detail = null; S.confirmDel = false; document.getElementById('sheet-root').innerHTML = ''; }

let toastTimer;
function toast(msg, undo) {
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? '<button data-act="undo">Deshacer</button>' : ''}</div>`;
  toast.undo = undo;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; toast.undo = null; }, 5000);
}

const ACTIONS = {
  go(r) { S.route = r; closeSheet(); render(); window.scrollTo(0, 0); },
  toggleHide() { S.hide = !S.hide; render(); },
  openAdd() { S.draft = newDraft(); S.detail = null; renderSheet(); },
  closeSheet() { closeSheet(); },
  dtype(t) { const n = newDraft(t); n.amount = S.draft.amount; n.desc = S.draft.desc; n.date = S.draft.date; n.nlp = S.draft.nlp; S.draft = n; renderSheet(); },
  key(k) { const d = S.draft; if (k === 'del') d.amount = d.amount.slice(0, -1); else if (d.amount.length < 11 && !(d.amount === '' && k.startsWith('0'))) d.amount += k; renderSheet(); },
  dcur() { const d = S.draft; d.currency = d.currency === 'ARS' ? 'USD' : 'ARS'; const ok = accountsFor(d); if (!ok.find(a => a.id === d.account)) d.account = ok[0]?.id; renderSheet(); },
  dcat(id) { S.draft.cat = S.draft.cat === id ? null : id; renderSheet(); },
  allCats() { S.draft.allCats = !S.draft.allCats; renderSheet(); },
  dacc(id) { S.draft.account = id; if (id !== 'tarjeta') S.draft.cuotas = 1; renderSheet(); },
  dcuotas(n) { S.draft.cuotas = +n; renderSheet(); },
  dfrom(id) { S.draft.from = id; if (S.draft.to === id) S.draft.to = S.accounts.find(a => a.id !== id).id; renderSheet(); },
  dto(id) { S.draft.to = id; renderSheet(); },
  ddate(v) { S.draft.date = v; renderSheet(); },
  save() { saveDraft(); },
  openTx(id) { S.detail = id; S.draft = null; S.confirmDel = false; renderSheet(); },
  setCat(id) { const t = S.tx.find(x => x.id === S.detail); t.cat = id; render(); },
  delAsk() { S.confirmDel = true; renderSheet(); },
  delNo() { S.confirmDel = false; renderSheet(); },
  delYes() { const t = S.tx.find(x => x.id === S.detail); S.tx = S.tx.filter(x => x !== t); closeSheet(); toast('Movimiento eliminado', () => { S.tx.push(t); render(); }); render(); },
  undo() { toast.undo?.(); document.getElementById('toast-root').innerHTML = ''; },
  month(arg) { const [k, d] = arg.split(':'); const key = k === 'ana' ? 'anaMonth' : 'movMonth'; const n = addMonths(S[key], +d); if (n >= MONTHS[0] && n <= CUR) S[key] = n; render(); },
  anaCur(c) { S.anaCur = c; render(); },
  movFilter(f) { S.movFilter = f; render(); },
  exportCsv() {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    S.csv = ['fecha,hora,tipo,cuenta,categoria,descripcion,monto,moneda,cuenta_destino,monto_destino,moneda_destino',
      ...sortTx(S.tx.filter(posted)).map(t => [t.date, t.time, t.type, acc(t.account).name, cat(t.cat)?.name || '', t.desc || '', t.amount, t.currency, t.to ? acc(t.to).name : '', t.toAmount ?? '', t.toCurrency || ''].map(q).join(','))].join('\n');
    render();
  },
  copyCsv(_, el) {
    navigator.clipboard?.writeText(S.csv).then(() => toast('CSV copiado'), () => { const ta = document.getElementById('csv'); ta.focus(); ta.select(); toast('Seleccioné el texto: copialo con Ctrl+C o Copiar'); });
  },
  resetAsk() { S.confirmReset = true; render(); },
  resetNo() { S.confirmReset = false; render(); },
  resetYes() { const route = S.route; resetState(); S.route = route; toast('Datos de ejemplo restablecidos'); render(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  ACTIONS[el.dataset.act]?.(el.dataset.arg, el, e);
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input;
  if (!k) return;
  if (k === 'movQuery') { S.movQuery = e.target.value; document.getElementById('movlist').innerHTML = movList(); }
  else if (S.draft) S.draft[k] = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.dataset.change === 'rate') { const v = Math.round(+e.target.value); if (v > 0) { S.rate = v; toast(`Cotización actualizada: ${fmt(v, 'ARS', { force: true })}`); render(); } }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'nlp') return;
  e.preventDefault();
  const d = S.draft, p = parseNatural(d.nlp || '');
  if (!p) { d.parsed = null; toast('No encontré un monto. Probá con “gasté 8500 en café”.'); renderSheet(); return; }
  const n = newDraft(p.type);
  Object.assign(n, { amount: String(p.amount), currency: p.currency, cat: p.cat, date: p.date, desc: p.desc, nlp: d.nlp });
  const ok = accountsFor(n); if (!ok.find(a => a.id === n.account)) n.account = ok[0]?.id;
  n.parsed = `${p.type === 'income' ? 'Ingreso' : 'Gasto'} · ${fmt(p.amount, p.currency, { force: true })} · ${p.cat ? cat(p.cat).name : 'sin categoría'} · ${dayLabel(p.date).toLowerCase()}${p.desc ? ' · ' + p.desc : ''}`;
  S.draft = n; renderSheet();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.draft || S.detail)) { closeSheet(); return; }
  if (!S.draft || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  if (/^[0-9]$/.test(e.key)) ACTIONS.key(e.key);
  else if (e.key === 'Backspace') ACTIONS.key('del');
  else if (e.key === 'Enter' && +S.draft.amount) saveDraft();
});

// Tooltip para marcas de gráficos y barras
const tip = document.getElementById('tip');
function showTip(el, x, y) { tip.textContent = el.dataset.tip; tip.hidden = false; const w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px'; tip.style.top = Math.max(8, y - 44) + 'px'; }
document.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') showTip(el, e.clientX, e.clientY); });
document.addEventListener('pointermove', e => { const el = e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') showTip(el, e.clientX, e.clientY); else if (e.pointerType === 'mouse') tip.hidden = true; });
document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-tip]'); if (el && e.pointerType !== 'mouse') { showTip(el, e.clientX, e.clientY); clearTimeout(showTip.t); showTip.t = setTimeout(() => tip.hidden = true, 2200); } });
document.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

render();
</script>
